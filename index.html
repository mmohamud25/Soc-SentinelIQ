                  <div className="mono" style={{ fontSize:22,fontWeight:700,color:sc.c,marginBottom:2 }}>{s.value}</div>
                  <div style={{ fontSize:11,color:C.secondary,textTransform:"uppercase",letterSpacing:"0.06em",fontFamily:"IBM Plex Mono" }}>{s.label}</div>
                  <div style={{ fontSize:10,color:C.muted,marginTop:2 }}>{s.sub}</div>
                </button>
              );
            })}
          </div>
          )}

          {/* Main Layout */}
          <div style={{ flex:1,minHeight:0,display:"flex",overflow:"hidden" }}>

            {/* Sidebar */}
            <Sidebar active={sideTab} onChange={setSideTab}/>

            {/* Dashboard — command center */}
            {sideTab==="dashboard" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><DashboardOverview alerts={alerts} incidents={INCIDENTS_RAW} kevs={kevs} activity={activity} setSideTab={setSideTab}/></div></EB>}

            {/* Threat Hunt */}
            {sideTab==="hunt" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><ThreatHunt alerts={alerts}/></div></EB>}

            {/* Reports */}
            {sideTab==="reports" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><ReportsPanel/></div></EB>}

            {/* Settings */}
            {sideTab==="settings" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><SettingsPanel setSideTab={setSideTab}/></div></EB>}

            {/* Incident Management */}
            {sideTab==="incidents" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><IncidentDashboard/></div></EB>}

            {/* GRC Tracker */}
            {sideTab==="grc" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><GRCDashboard/></div></EB>}

            {/* Alert Queue — only shown when sideTab is alerts */}
            {sideTab === "alerts" && (<>

            {/* LEFT: Alert list */}
            <div style={{ width:280,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0 }}>

              {/* Column header */}
              <div style={{ padding:"10px 14px",borderBottom:`1px solid ${C.border}`,flexShrink:0,background:C.surface }}>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6 }}>
                  <span className="mono" style={{ fontSize:11,fontWeight:700,color:C.bright,textTransform:"uppercase",letterSpacing:"0.12em" }}>Alert Queue</span>
                  <div style={{ display:"flex",alignItems:"center",gap:6 }}>
                    <Dot live={true}/>
                    <span className="mono" style={{ fontSize:10,color:C.subtle }}>{filteredAlerts.length} shown</span>
                  </div>
                </div>
                <div style={{ display:"flex",gap:6,alignItems:"center" }}>
                  <div style={{ position:"relative",flex:1 }}>
                    <svg style={{ position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",pointerEvents:"none" }} width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke={C.muted} strokeWidth="2"/><path d="M21 21l-4.35-4.35" stroke={C.muted} strokeWidth="2" strokeLinecap="round"/></svg>
                    <input ref={searchRef} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search alerts..."
                      aria-label="Search alerts"
                      style={{ width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:5,padding:"5px 8px 5px 26px",fontSize:12,color:C.bright,fontFamily:"DM Sans,sans-serif" }}/>
                  </div>
                  {search && <button type="button" onClick={()=>setSearch("")} style={{ background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:14,padding:"0 2px",lineHeight:1 }}>✕</button>}
                </div>
              </div>

              {/* Severity filter chips */}
              <div style={{ padding:"6px 10px",borderBottom:`1px solid ${C.border}`,display:"flex",gap:4,flexShrink:0,background:"rgba(255,255,255,0.01)" }}>
                {[{key:null,label:"All",count:alerts.length},{key:"CRITICAL",label:"Crit",count:alerts.filter(a=>a.severity==="CRITICAL").length},{key:"HIGH",label:"High",count:alerts.filter(a=>a.severity==="HIGH").length},{key:"Open",label:"Open",count:open}].map(f=>{
                  const isActive = filter===f.key || (f.key===null&&!filter);
                  const fColor = f.key==="CRITICAL"?"#f87171":f.key==="HIGH"?"#fb923c":f.key==="Open"?C.cyan:C.subtle;
                  return (
                    <button key={String(f.key)} type="button" onClick={()=>setFilter(f.key==="Open"?"Open":f.key)}
                      style={{ flex:1,padding:"3px 0",fontSize:10,fontFamily:"IBM Plex Mono",borderRadius:4,cursor:"pointer",border:`1px solid ${isActive?(fColor+"60"):C.border}`,background:isActive?`${fColor}15`:"none",color:isActive?fColor:C.muted,transition:"all 0.15s" }}>
                      {f.label} <span style={{ opacity:0.7 }}>{f.count}</span>
                    </button>
                  );
                })}
              </div>

              {/* Alert list */}
              <div style={{ flex:1,overflowY:"auto",padding:"6px 8px" }}>
                {filteredAlerts.length === 0
                  ? (
                    <div style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:120,gap:8,color:C.muted }}>
                      <svg width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" strokeWidth="1.5" d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
                      <span style={{ fontSize:12 }}>No alerts match</span>
                      {(search||filter) && <button type="button" onClick={()=>{setSearch("");setFilter(null);}} style={{ fontSize:11,color:C.cyan,background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Clear filters</button>}
                    </div>
                  )
                  : filteredAlerts.map(a=><AlertRow key={a.id} alert={a} onClick={setSel} selected={sel?.id===a.id} timeStr={timeAgo(a.offsetMs)}/>)
                }
              </div>

              {/* Active filter chip */}
              {filter && (
                <div style={{ padding:"5px 12px",borderTop:`1px solid ${C.border}`,fontSize:11,color:C.cyan,background:C.cyanDim,display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0 }}>
                  <span className="mono">Filtered: {filter}</span>
                  <button type="button" onClick={()=>setFilter(null)} style={{ background:"none",border:"none",color:C.cyan,cursor:"pointer",fontSize:11,fontFamily:"IBM Plex Mono" }}>✕ Clear</button>
                </div>
              )}

              {/* Footer hint */}
              <div style={{ padding:"5px 12px",borderTop:`1px solid ${C.border}`,flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center" }}>
                <span style={{ fontSize:10,color:C.muted }}>j/k to navigate</span>
                <button type="button" onClick={()=>setShowKeys(true)} style={{ fontSize:10,color:C.muted,background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono" }}>? shortcuts</button>
              </div>
            </div>

            {/* CENTER: Alert detail */}
            <div style={{ flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0 }}>

              {/* Tab strip */}
              <div style={{ borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,background:C.surface,paddingRight:12 }}>
                <div style={{ display:"flex" }}>
                  {[{key:"alerts",label:"Alert Detail",sub:"AI Analysis + SOAR"},{key:"cisa",label:"CISA KEV",sub:loaded?`${kevs.length} live CVEs`:"Loading..."}].map(t=>(
                    <button key={t.key} type="button" onClick={()=>setTab(t.key)}
                      style={{ padding:"10px 18px",fontSize:11,background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono",borderBottom:tab===t.key?`2px solid ${C.cyan}`:"2px solid transparent",color:tab===t.key?C.cyan:C.subtle,transition:"color 0.15s",textAlign:"left" }}>
                      <div style={{ textTransform:"uppercase",letterSpacing:"0.1em" }}>{t.label}</div>
                      <div style={{ fontSize:9,color:tab===t.key?C.subtle:C.muted,marginTop:1,letterSpacing:"0.05em" }}>{t.sub}</div>
                    </button>
                  ))}
                </div>
                {sel && tab==="alerts" && (
                  <div style={{ display:"flex",alignItems:"center",gap:6 }}>
                    <span className="mono" style={{ fontSize:10,color:C.muted }}>{sel.id}</span>
                    <span style={{ fontSize:10,color:C.muted }}>·</span>
                    <span className="mono" style={{ fontSize:10,color:SEV[sel.severity]?.text||C.subtle }}>{sel.severity}</span>
                  </div>
                )}
              </div>

              <div style={{ flex:1,overflowY:"auto",padding:16 }}>
                {tab==="alerts" && <AlertDetail alert={sel} onTriage={handleTriage} onCreateIncident={(a)=>{ setSideTab("incidents"); setToast(`Incident created from ${a.id}`); }}/>}
                {tab==="cisa" && (
                  <div>
                    <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:14,padding:"10px 12px",background:C.card,borderRadius:8,border:`1px solid ${C.border}` }}>
                      <Dot live={true}/>
                      <span style={{ fontSize:12,color:C.text,fontWeight:500 }}>CISA Known Exploited Vulnerabilities</span>
                      <span className="mono" style={{ fontSize:10,color:C.subtle,marginLeft:"auto" }}>Proxied via Supabase · Updated daily</span>
                    </div>
                    <CISAFeed vulns={kevs} loaded={loaded}/>
                  </div>
                )}
              </div>
            </div>

            {/* RIGHT: Threat intel panel */}
            <div style={{ width:272,borderLeft:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0 }}>

              {/* Column header */}
              <div style={{ padding:"10px 14px",borderBottom:`1px solid ${C.border}`,flexShrink:0,background:C.surface }}>
                <span className="mono" style={{ fontSize:11,fontWeight:700,color:C.bright,textTransform:"uppercase",letterSpacing:"0.12em" }}>Threat Intel</span>
              </div>

              <div style={{ flex:1,overflowY:"auto" }}>

                {/* IOC Lookup */}
                <div style={{ padding:14,borderBottom:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:10 }}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke={C.cyan} strokeWidth="1.5"/><path d="M21 21l-4.35-4.35" stroke={C.cyan} strokeWidth="1.5" strokeLinecap="round"/></svg>
                    <span className="mono" style={{ fontSize:10,color:C.cyan,textTransform:"uppercase",letterSpacing:"0.1em" }}>IOC Lookup</span>
                    <span style={{ marginLeft:"auto",fontSize:9,color:C.muted,fontFamily:"IBM Plex Mono" }}>AbuseIPDB · VT</span>
                  </div>
                  <IOCLookup/>
                </div>

                {/* Activity Feed */}
                <div style={{ padding:14,borderBottom:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:10 }}>
                    <Dot live={true}/>
                    <span className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>Activity Feed</span>
                  </div>
                  {activity.map((a,i)=>{
                    const target = alerts.find(al=>al.id===a.id);
                    return (
                      <button key={i} type="button"
                        onClick={()=>{ if(target){ setSel(target); setSideTab("alerts"); } }}
                        style={{ width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:8,marginBottom:6,background:"none",border:"none",cursor:target?"pointer":"default",borderRadius:5,padding:"5px 6px",transition:"background 0.15s" }}
                        onMouseEnter={e=>{ if(target) e.currentTarget.style.background=C.card; }}
                        onMouseLeave={e=>{ e.currentTarget.style.background="none"; }}
                      >
                        <span className="mono" style={{ fontSize:10,color:C.cyan,flexShrink:0,width:54 }}>{a.id}</span>
                        <div style={{ flex:1,minWidth:0 }}>
                          <div style={{ fontSize:11,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{a.msg}</div>
                          <div className="mono" style={{ fontSize:10,color:C.subtle }}>{timeAgo(a.offsetMs)}</div>
                        </div>
                        {target && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" style={{ flexShrink:0,color:C.muted }}><path d="M9 18l6-6-6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </button>
                    );
                  })}
                </div>

                {/* MITRE ATT&CK */}
                <div style={{ padding:14,borderBottom:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:10 }}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z" stroke={C.purple} strokeWidth="1.5"/></svg>
                    <span className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>MITRE ATT&CK</span>
                    <span style={{ marginLeft:"auto",fontSize:9,color:C.muted,fontFamily:"IBM Plex Mono" }}>Active tactics</span>
                  </div>
                  {MITRE.map(({tactic,count,color})=>(
                    <div key={tactic} style={{ marginBottom:8 }}>
                      <div style={{ display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3 }}>
                        <span style={{ color:C.secondary }}>{tactic}</span>
                        <span className="mono" style={{ color:C.subtle }}>{count}</span>
                      </div>
                      <div style={{ height:3,background:"rgba(255,255,255,0.05)",borderRadius:2,overflow:"hidden" }}>
                        <div style={{ height:"100%",background:color,borderRadius:2,width:`${(count/MITRE_MAX)*100}%`,transition:"width 0.5s ease" }}/>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Attribution */}
                <div style={{ padding:14 }}>
                  <div style={{ fontSize:11,color:C.muted,lineHeight:1.8 }}>
                    Portfolio project by <a href="https://mmohamud.me" target="_blank" style={{ color:C.cyan,textDecoration:"none" }}>Mohamed Mohamud</a>
                    <br/>React · Supabase · Claude API
                    <br/><a href="https://github.com/mmohamud25" target="_blank" style={{ color:C.subtle,textDecoration:"none" }}>GitHub</a>
                    {" · "}
                    <a href="https://linkedin.com/in/mohamed-2-mohamud" target="_blank" style={{ color:C.subtle,textDecoration:"none" }}>LinkedIn</a>
                  </div>
                </div>

              </div>
            </div>

            </>)}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
