        setSelInc(prev=>prev?.id===id?{...prev,timeline:[...prev.timeline,newEntry]}:prev);

    // ── Reports ───────────────────────────────────────────────────────────────
    function ReportsPanel() {
      const [aiStatus,  setAiStatus]  = useState("idle");
      const [parsed,    setParsed]    = useState(null);
      const [errMsg,    setErrMsg]    = useState("");
      const [genTime,   setGenTime]   = useState(null);
      const [copied,    setCopied]    = useState(false);
      const grcScore = Math.round((CONTROLS_RAW.filter(c=>c.status==="Implemented").length/CONTROLS_RAW.length)*100);
      const closed   = INCIDENTS_RAW.filter(i=>i.status==="Closed");

      // Auto-generate on first open
      useEffect(()=>{
        if (aiStatus==="idle" && !parsed) generateSummary();
      },[]);

      const generateSummary = async () => {
        setAiStatus("loading"); setParsed(null); setErrMsg("");
        try {
          const payload = {
            weeklySummary: {
              alerts: ALERTS_RAW.length,
              critical: ALERTS_RAW.filter(a=>a.severity==="CRITICAL").length,
              incidents: INCIDENTS_RAW.length,
              closedIncidents: closed.length,
              grcScore,
              topTactics: MITRE.slice(0,3).map(m=>m.tactic),
              topThreats: INCIDENTS_RAW.slice(0,3).map(i=>i.title),
            }
          };
          const res = await fetch(SUPABASE_URL,{ method:"POST",headers:sbHeaders(),body:JSON.stringify(payload) });
          const data = await res.json();
          if (!res.ok||data.error) throw new Error(data.error||"Error");

          // Try to parse structured JSON from response
          let result = null;
          try {
            const raw = data.summary || "";
            const s = raw.indexOf("{"), e = raw.lastIndexOf("}");
            if (s>=0 && e>s) result = JSON.parse(raw.slice(s,e+1));
          } catch {}

          // If not JSON, wrap the text
          if (!result) result = { threatLevel:"—", summary: data.summary||"", topThreats:[], grcStatus:`${grcScore}%`, recommendedActions:[], weeklyTrend:"See summary above" };

          setParsed(result);
          setGenTime(new Date());
          setAiStatus("done");
        } catch(e) { setErrMsg(e.message); setAiStatus("error"); }
      };

      const copyToClipboard = () => {
        if (!parsed) return;
        const text = [
          `SentinelIQ Weekly Threat Summary — ${new Date().toUTCString()}`,
          `Threat Level: ${parsed.threatLevel}`,
          `Summary: ${parsed.summary}`,
          `Top Threats: ${parsed.topThreats?.join(", ")}`,
          `GRC Status: ${parsed.grcStatus}`,
          `Trend: ${parsed.weeklyTrend}`,
          `Recommended Actions:\n${parsed.recommendedActions?.map((a,i)=>`${i+1}. ${a}`).join("\n")}`,
        ].join("\n\n");
        navigator.clipboard.writeText(text).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); });
      };

      const tColor = { CRITICAL:"#dc2626",HIGH:"#f97316",MEDIUM:"#fbbf24",LOW:"#4ade80",ELEVATED:"#f97316" };

      return (
        <div style={{ flex:1,overflowY:"auto",padding:20,display:"flex",flexDirection:"column",gap:16 }}>

          {/* AI Weekly Summary */}
          <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16 }}>
            <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8 }}>
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill={C.purple}/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke={C.purple} strokeWidth="1.5" strokeLinecap="round"/></svg>
                <span className="mono" style={{ fontSize:12,color:C.purple,textTransform:"uppercase",letterSpacing:"0.1em" }}>AI Weekly Threat Summary</span>
                {aiStatus==="loading" && <Spinner/>}
                {genTime && aiStatus==="done" && <span style={{ fontSize:10,color:C.subtle }}>Generated {genTime.toUTCString().slice(0,-4)} UTC</span>}
              </div>
              <div style={{ display:"flex",gap:6 }}>
                {aiStatus==="done" && <>
                  <button type="button" onClick={copyToClipboard} style={{ padding:"5px 12px",background:copied?C.greenDim:C.cyanDim,border:`1px solid ${copied?"rgba(74,222,128,0.3)":"rgba(34,211,238,0.3)"}`,borderRadius:5,color:copied?C.green:C.cyan,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>{copied?"✓ Copied":"Copy"}</button>
                  <button type="button" onClick={()=>window.print()} style={{ padding:"5px 12px",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,borderRadius:5,color:C.subtle,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>Print / PDF</button>
                  <button type="button" onClick={()=>{setParsed(null);setAiStatus("idle");}} style={{ padding:"5px 12px",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,borderRadius:5,color:C.subtle,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>Refresh</button>
                </>}
                {(aiStatus==="idle"||aiStatus==="error") && <button type="button" onClick={generateSummary} style={{ padding:"5px 12px",background:C.purpleDim,border:`1px solid rgba(167,139,250,0.4)`,borderRadius:5,color:C.purple,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>Generate</button>}
              </div>
            </div>

            {aiStatus==="loading" && (
              <div style={{ borderRadius:8,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:14,display:"flex",flexDirection:"column",gap:8 }}>
                {["Aggregating alert data...","Reviewing incident timeline...","Analyzing GRC posture...","Writing summary..."].map((s,i)=>(
                  <div key={i} className="pulse mono" style={{ display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.subtle,animationDelay:`${i*0.3}s` }}>
                    <span style={{ width:5,height:5,borderRadius:"50%",background:C.purple,display:"inline-block" }}/>{s}
                  </div>
                ))}
              </div>
            )}

            {aiStatus==="error" && <div style={{ borderRadius:8,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:12,fontSize:12,color:"#f87171" }}>{errMsg}</div>}

            {aiStatus==="done" && parsed && (
              <div className="fade-in" style={{ display:"flex",flexDirection:"column",gap:10 }}>
                {/* Threat level + summary */}
                <div style={{ display:"grid",gridTemplateColumns:"140px 1fr",gap:10 }}>
                  <div style={{ borderRadius:8,border:`1px solid ${(tColor[parsed.threatLevel]||C.subtle)+"40"}`,background:`${tColor[parsed.threatLevel]||C.subtle}10`,padding:12,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4 }}>
                    <div style={{ fontSize:10,color:C.subtle }}>THREAT LEVEL</div>
                    <div className="mono" style={{ fontSize:16,fontWeight:700,color:tColor[parsed.threatLevel]||C.subtle }}>{parsed.threatLevel||"—"}</div>
                    {parsed.weeklyTrend && <div style={{ fontSize:10,color:C.subtle,textAlign:"center",marginTop:4 }}>{parsed.weeklyTrend}</div>}
                  </div>
                  <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,padding:12 }}>
                    <div style={{ fontSize:10,color:C.subtle,marginBottom:6 }}>EXECUTIVE SUMMARY</div>
                    <div style={{ fontSize:13,color:C.text,lineHeight:1.75 }}>{parsed.summary}</div>
                  </div>
                </div>

                {/* Top threats + GRC */}
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
                  {parsed.topThreats?.length>0 && (
                    <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,padding:12 }}>
                      <div style={{ fontSize:10,color:"#f87171",marginBottom:8 }}>⚠ TOP THREATS THIS WEEK</div>
                      {parsed.topThreats.map((t,i)=>(
                        <div key={i} style={{ display:"flex",alignItems:"flex-start",gap:6,marginBottom:6,fontSize:12,color:C.text }}>
                          <span style={{ color:"#f87171",flexShrink:0 }}>•</span>{t}
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,padding:12 }}>
                    <div style={{ fontSize:10,color:C.subtle,marginBottom:8 }}>📊 GRC STATUS</div>
                    <div className="mono" style={{ fontSize:18,fontWeight:700,color:grcScore>=80?C.green:grcScore>=60?"#fbbf24":"#f87171",marginBottom:4 }}>{grcScore}%</div>
                    <div style={{ fontSize:12,color:C.secondary }}>{parsed.grcStatus}</div>
                  </div>
                </div>

                {/* Recommended actions */}
                {parsed.recommendedActions?.length>0 && (
                  <div style={{ borderRadius:8,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:12 }}>
                    <div style={{ fontSize:10,color:C.purple,marginBottom:10 }}>✅ RECOMMENDED ACTIONS</div>
                    {parsed.recommendedActions.map((a,i)=>(
                      <div key={i} style={{ display:"flex",alignItems:"flex-start",gap:8,marginBottom:8 }}>
                        <span className="mono" style={{ width:18,height:18,borderRadius:"50%",background:C.purpleDim,border:`1px solid rgba(167,139,250,0.3)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:C.purple,flexShrink:0 }}>{i+1}</span>
                        <span style={{ fontSize:12,color:C.text,lineHeight:1.6 }}>{a}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* GRC Snapshot */}
          <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16 }}>
            <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:12 }}>GRC Compliance Snapshot</div>
            <div style={{ display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12 }}>
              {[["Score",`${grcScore}%`,grcScore>=80?"#4ade80":grcScore>=60?"#fbbf24":"#f87171"],
                ["Implemented",CONTROLS_RAW.filter(c=>c.status==="Implemented").length,"#4ade80"],
                ["Gaps",CONTROLS_RAW.filter(c=>c.status==="Not Started").length,"#f87171"]].map(([k,v,c])=>(
                <div key={k} style={{ textAlign:"center",padding:10,borderRadius:8,border:`1px solid ${C.border}` }}>
                  <div className="mono" style={{ fontSize:20,fontWeight:700,color:c }}>{v}</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:2 }}>{k}</div>
                </div>
              ))}
            </div>
            <div style={{ display:"flex",gap:8 }}>
              <button type="button" style={{ padding:"7px 16px",background:C.cyanDim,border:`1px solid rgba(34,211,238,0.3)`,borderRadius:6,color:C.cyan,fontSize:12,fontFamily:"IBM Plex Mono",cursor:"pointer" }} onClick={()=>alert("PDF export coming in v3.0")}>Export PDF</button>
              <button type="button" style={{ padding:"7px 16px",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,borderRadius:6,color:C.subtle,fontSize:12,fontFamily:"IBM Plex Mono",cursor:"pointer" }} onClick={()=>alert("CSV export coming in v3.0")}>Export CSV</button>
            </div>
          </div>

          {/* Incident report cards */}
          <div>
            <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10 }}>Incident Reports ({INCIDENTS_RAW.length})</div>

              {INCIDENTS_RAW.map(inc=>{

      { id:"RSK-004", title:"Third-Party Breach",     likelihood:3, impact:4, category:"Supply Chain",   status:"Open",     control:"GV.OC-03", treatment:"Transfer" },
      { id:"RSK-005", title:"Unpatched Systems",      likelihood:4, impact:3, category:"Vulnerability",  status:"Open",     control:"ID.RA-01", treatment:"Mitigate" },
      { id:"RSK-006", title:"DDoS Attack",            likelihood:3, impact:3, category:"Availability",   status:"Accepted", control:"DE.CM-01", treatment:"Accept"   },
    ];

    const STATUS_STYLE = {
      "Implemented": { c:"#4ade80", bg:"rgba(74,222,128,0.1)",  b:"rgba(74,222,128,0.3)"  },
      "In Progress":  { c:"#fbbf24", bg:"rgba(234,179,8,0.1)",  b:"rgba(234,179,8,0.3)"  },
      "Not Started":  { c:"#f87171", bg:"rgba(239,68,68,0.1)",  b:"rgba(239,68,68,0.3)"  },
      "Not Applicable":{ c:"#475569", bg:"rgba(71,85,105,0.1)", b:"rgba(71,85,105,0.3)"  },
    };

    const PRIORITY_COLOR = { Critical:"#dc2626", High:"#f97316", Medium:"#fbbf24", Low:"#4ade80" };
    const RISK_LEVEL = (l,i) => { const s=l*i; return s>=16?"CRITICAL":s>=10?"HIGH":s>=5?"MEDIUM":"LOW"; };
    const RISK_COLOR = { CRITICAL:"#dc2626", HIGH:"#f97316", MEDIUM:"#fbbf24", LOW:"#4ade80" };

    // ── GRC Dashboard ─────────────────────────────────────────────────────────
    function GRCDashboard() {
      const [controls,    setControls]    = useState(CONTROLS_RAW);
      const [selectedCtrl,setSelectedCtrl]= useState(CONTROLS_RAW[0]);
      const [activeFunc,  setActiveFunc]  = useState("ALL");
      const [aiStatus,    setAiStatus]    = useState("idle");
      const [aiOutput,    setAiOutput]    = useState("");
      const [activeTab,   setActiveTab]   = useState("controls"); // controls | risks

      const implemented  = controls.filter(c=>c.status==="Implemented").length;
      const inProgress   = controls.filter(c=>c.status==="In Progress").length;
      const notStarted   = controls.filter(c=>c.status==="Not Started").length;
      const score        = Math.round((implemented / controls.length) * 100);

      const filtered = activeFunc==="ALL" ? controls : controls.filter(c=>c.fn===activeFunc);

      const [grcToast, setGrcToast] = useState("");
      const updateStatus = (id, newStatus) => {
        setControls(prev=>prev.map(c=>c.id===id?{...c,status:newStatus}:c));
        setSelectedCtrl(prev=>prev?.id===id?{...prev,status:newStatus}:prev);
        setGrcToast(`${id} → ${newStatus}`);
        setTimeout(()=>setGrcToast(""),2000);
      };

      const runAI = async () => {
        if (!selectedCtrl) return;
        setAiStatus("loading"); setAiOutput("");
        try {
          const res = await fetch(SUPABASE_URL, {
            method:"POST", headers:sbHeaders(),
            body:JSON.stringify({ grcControl: selectedCtrl }),
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || "Edge function error");
          setAiOutput(data.guidance || data.analysis?.summary || "Guidance generated.");
          setAiStatus("done");
        } catch(e) { setAiOutput(e.message); setAiStatus("error"); }
      };

      useEffect(()=>{ setAiStatus("idle"); setAiOutput(""); },[selectedCtrl?.id]);

      const scoreColor = score>=80?"#4ade80":score>=60?"#fbbf24":"#f87171";
      const fnColor = (fn) => NIST_FUNCTIONS.find(f=>f.id===fn)?.color || C.subtle;

      return (
        <div style={{ display:"flex",flexDirection:"column",height:"100%",overflow:"hidden" }}>

          {/* GRC Header Stats */}
          <div style={{ padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,flexShrink:0 }}>
            {[
              { label:"Total Controls", value:controls.length,  color:C.bright },
              { label:"Implemented",    value:implemented,       color:"#4ade80" },
              { label:"In Progress",    value:inProgress,        color:"#fbbf24" },
              { label:"Gaps",           value:notStarted,        color:"#f87171" },
            ].map(s=>(
              <div key={s.label} style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px" }}>
                <div className="mono" style={{ fontSize:20,fontWeight:700,color:s.color }}>{s.value}</div>
                <div style={{ fontSize:11,color:C.subtle,marginTop:2 }}>{s.label}</div>
              </div>
            ))}
          </div>

          {/* Main 3-col */}
          <div style={{ flex:1,display:"grid",gridTemplateColumns:"240px 1fr 260px",overflow:"hidden" }}>

            {/* Left: Function filter + control list */}
            <div style={{ borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden" }}>
              <div style={{ padding:"8px",borderBottom:`1px solid ${C.border}`,flexShrink:0 }}>
                <div style={{ display:"flex",flexWrap:"wrap",gap:4 }}>
                  <button type="button" onClick={()=>setActiveFunc("ALL")}
                    style={{ fontSize:10,padding:"3px 7px",borderRadius:4,fontFamily:"IBM Plex Mono",cursor:"pointer",border:`1px solid ${activeFunc==="ALL"?C.cyan:C.border}`,background:activeFunc==="ALL"?C.cyanDim:"none",color:activeFunc==="ALL"?C.cyan:C.subtle }}>ALL</button>
                  {NIST_FUNCTIONS.map(f=>(
                    <button key={f.id} type="button" onClick={()=>setActiveFunc(f.id)}
                      style={{ fontSize:10,padding:"3px 7px",borderRadius:4,fontFamily:"IBM Plex Mono",cursor:"pointer",border:`1px solid ${activeFunc===f.id?f.color:C.border}`,background:activeFunc===f.id?`${f.color}18`:"none",color:activeFunc===f.id?f.color:C.subtle }}>{f.id}</button>
                  ))}
                </div>
              </div>
              <div style={{ flex:1,overflowY:"auto",padding:8 }}>
                {filtered.map(ctrl=>{
                  const ss = STATUS_STYLE[ctrl.status] || STATUS_STYLE["Not Started"];
                  const fc = fnColor(ctrl.fn);
                  const isSelected = selectedCtrl?.id===ctrl.id;
                  return (
                    <button key={ctrl.id} type="button" onClick={()=>setSelectedCtrl(ctrl)}
                      style={{ width:"100%",textAlign:"left",padding:"8px 10px",borderRadius:6,marginBottom:4,cursor:"pointer",border:`1px solid ${isSelected?ss.b:C.border}`,borderLeft:`3px solid ${isSelected?fc:"transparent"}`,background:isSelected?C.card:"rgba(255,255,255,0.01)",transition:"all 0.15s" }}>
                      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3 }}>
                        <span className="mono" style={{ fontSize:10,color:fc }}>{ctrl.id}</span>
                        <span style={{ fontSize:10,padding:"1px 5px",borderRadius:3,color:ss.c,background:ss.bg,border:`1px solid ${ss.b}`,fontFamily:"IBM Plex Mono" }}>{ctrl.status.replace(" ","·")}</span>
                      </div>
                      <div style={{ fontSize:12,color:C.text,lineHeight:1.3 }}>{ctrl.name}</div>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Center: Tabs — Controls detail | Risk Register */}
            <div style={{ display:"flex",flexDirection:"column",overflow:"hidden" }}>
              <div style={{ borderBottom:`1px solid ${C.border}`,display:"flex",flexShrink:0 }}>
                {[{key:"controls",label:"Control Detail"},{key:"risks",label:`Risk Register (${RISKS_DATA.length})`}].map(t=>(
                  <button key={t.key} type="button" onClick={()=>setActiveTab(t.key)}
                    style={{ padding:"10px 16px",fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em",background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono",borderBottom:activeTab===t.key?`2px solid ${C.cyan}`:"2px solid transparent",color:activeTab===t.key?C.cyan:C.subtle }}>{t.label}</button>
                ))}
              </div>

              <div style={{ flex:1,overflowY:"auto",padding:16 }}>
                {activeTab==="controls" && selectedCtrl && (()=>{
                  const ss = STATUS_STYLE[selectedCtrl.status] || STATUS_STYLE["Not Started"];
                  const fc = fnColor(selectedCtrl.fn);
                  const fnObj = NIST_FUNCTIONS.find(f=>f.id===selectedCtrl.fn);
                  return (
                    <div style={{ display:"flex",flexDirection:"column",gap:12 }}>
                      <div style={{ borderRadius:8,border:`1px solid ${ss.b}`,background:ss.bg,padding:14 }}>
                        <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:6 }}>
                          <span className="mono" style={{ fontSize:12,color:fc,fontWeight:700 }}>{selectedCtrl.id}</span>
                          <span style={{ fontSize:11,padding:"2px 8px",borderRadius:4,color:ss.c,background:ss.bg,border:`1px solid ${ss.b}`,fontFamily:"IBM Plex Mono" }}>{selectedCtrl.status}</span>
                          <span style={{ marginLeft:"auto",fontSize:11,padding:"2px 8px",borderRadius:4,color:PRIORITY_COLOR[selectedCtrl.priority],background:`${PRIORITY_COLOR[selectedCtrl.priority]}18`,border:`1px solid ${PRIORITY_COLOR[selectedCtrl.priority]}40`,fontFamily:"IBM Plex Mono" }}>{selectedCtrl.priority}</span>
                        </div>
                        <div style={{ fontSize:15,fontWeight:600,color:C.bright,marginBottom:6 }}>{selectedCtrl.name}</div>
                        <div style={{ fontSize:12,color:C.secondary,lineHeight:1.7 }}>{selectedCtrl.desc}</div>
                      </div>

                      <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8 }}>
                        {[["Framework","NIST CSF 2.0"],["Function",`${fnObj?.id} — ${fnObj?.name}`],["Owner",selectedCtrl.owner],["Evidence",selectedCtrl.evidence],["Last Reviewed","Apr 2026"],["Next Review","Jul 2026"]].map(([k,v])=>(
                          <div key={k} style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:8 }}>
                            <div style={{ fontSize:10,color:C.subtle,marginBottom:2 }}>{k}</div>
                            <div className="mono" style={{ fontSize:11,color:C.text }}>{v}</div>
                          </div>
                        ))}
                      </div>

                      {/* Status updater */}
                      <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:12 }}>
                        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8 }}>
                          <div style={{ fontSize:11,color:C.subtle }}>Update Status</div>
                          {grcToast && <span className="mono" style={{ fontSize:10,color:C.green }}>✓ {grcToast}</span>}
                        </div>
                        <div style={{ display:"flex",gap:6,flexWrap:"wrap",marginBottom:6 }}>
                          {["Implemented","In Progress","Not Started","Not Applicable"].map(s=>{
                            const st = STATUS_STYLE[s];
                            const isActive = selectedCtrl.status===s;
                            return (
                              <button key={s} type="button" onClick={()=>updateStatus(selectedCtrl.id,s)}
                                style={{ padding:"5px 12px",borderRadius:5,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer",border:`1px solid ${isActive?st.b:C.border}`,background:isActive?st.bg:"none",color:isActive?st.c:C.subtle,transition:"all 0.15s" }}>{s}</button>
                            );
                          })}
                        </div>
                        <div style={{ fontSize:10,color:C.muted,marginTop:4 }}>Session only — changes reset on refresh</div>
                      </div>

                      {/* AI Guidance */}
                      <div style={{ borderTop:`1px solid ${C.border}`,paddingTop:14 }}>
                        <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10 }}>
                          <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill={C.purple}/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke={C.purple} strokeWidth="1.5" strokeLinecap="round"/></svg>
                            <span className="mono" style={{ fontSize:11,color:C.purple,textTransform:"uppercase",letterSpacing:"0.1em" }}>AI Implementation Guidance</span>
                            {aiStatus==="loading" && <Spinner/>}
                            {aiStatus==="done" && <span className="mono" style={{ fontSize:10,padding:"2px 6px",borderRadius:3,background:C.greenDim,border:`1px solid rgba(74,222,128,0.3)`,color:C.green }}>Done</span>}
                          </div>
                          {(aiStatus==="idle"||aiStatus==="error") &&
                            <button type="button" onClick={runAI} style={{ padding:"5px 12px",borderRadius:5,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer",background:C.purpleDim,border:`1px solid rgba(167,139,250,0.4)`,color:C.purple,display:"flex",alignItems:"center",gap:5 }}>
                              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
                              Get Guidance
                            </button>
                          }
                          {aiStatus==="done" && <button type="button" onClick={()=>{setAiStatus("idle");setAiOutput("");}} style={{ padding:"5px 12px",borderRadius:5,fontSize:11,background:"none",border:`1px solid ${C.border}`,color:C.subtle,cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Clear</button>}
                        </div>
                        {aiStatus==="idle" && <div style={{ borderRadius:7,border:`1px solid rgba(167,139,250,0.15)`,background:C.purpleDim,padding:11,fontSize:12,color:C.subtle }}>Get AI-generated implementation steps, evidence requirements, and best practices for this control.</div>}
                        {aiStatus==="loading" && (
                          <div style={{ borderRadius:7,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:12,display:"flex",flexDirection:"column",gap:8 }}>
                            {["Analyzing control requirements...","Checking implementation patterns...","Generating guidance..."].map((s,i)=>(
                              <div key={i} className="pulse mono" style={{ display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.subtle,animationDelay:`${i*0.3}s` }}>
                                <span style={{ width:5,height:5,borderRadius:"50%",background:C.purple,display:"inline-block" }}/>{s}
                              </div>
                            ))}
                          </div>
                        )}
                        {aiStatus==="done" && aiOutput && <div style={{ borderRadius:7,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:12,fontSize:12,color:C.text,lineHeight:1.75 }}>{aiOutput}</div>}
                        {aiStatus==="error" && <div style={{ borderRadius:7,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:11,fontSize:12,color:"#f87171" }}>Error: {aiOutput}</div>}
                      </div>
                    </div>
                  );
                })()}

                {activeTab==="risks" && (
                  <div style={{ display:"flex",flexDirection:"column",gap:8 }}>
                    <div style={{ fontSize:12,color:C.subtle,marginBottom:4 }}>Risk scores calculated as Likelihood × Impact (1–25 scale).</div>
                    {RISKS_DATA.map(r=>{
                      const score = r.likelihood * r.impact;
                      const level = RISK_LEVEL(r.likelihood, r.impact);
                      const rc    = RISK_COLOR[level];
                      return (
                        <div key={r.id} style={{ background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${rc}`,borderRadius:8,padding:12 }}>
                          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6 }}>
                            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                              <span className="mono" style={{ fontSize:10,color:C.subtle }}>{r.id}</span>
                              <span style={{ fontSize:13,fontWeight:600,color:C.bright }}>{r.title}</span>
                            </div>
                            <span className="mono" style={{ fontSize:12,fontWeight:700,color:rc }}>{level} ({score})</span>
                          </div>
                          <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6 }}>
                            {[["Likelihood",`${r.likelihood}/5`],["Impact",`${r.impact}/5`],["Category",r.category],["Treatment",r.treatment]].map(([k,v])=>(
                              <div key={k}>
                                <div style={{ fontSize:10,color:C.subtle }}>{k}</div>
                                <div className="mono" style={{ fontSize:11,color:C.text,marginTop:1 }}>{v}</div>
                              </div>
                            ))}
                          </div>
                          <div style={{ marginTop:6,fontSize:11,color:C.subtle }}>
                            Control: <span className="mono" style={{ color:C.cyan }}>{r.control}</span>
                            <span style={{ marginLeft:12,padding:"1px 6px",borderRadius:3,fontSize:10,fontFamily:"IBM Plex Mono",color:r.status==="Open"?"#f87171":"#4ade80",background:r.status==="Open"?"rgba(239,68,68,0.1)":"rgba(74,222,128,0.1)",border:`1px solid ${r.status==="Open"?"rgba(239,68,68,0.3)":"rgba(74,222,128,0.3)"}` }}>{r.status}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>

            {/* Right: Compliance score + function breakdown */}
            <div style={{ borderLeft:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden" }}>
              <div style={{ padding:"10px 14px",borderBottom:`1px solid ${C.border}` }}>
                <span className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>Compliance</span>
              </div>
              <div style={{ flex:1,overflowY:"auto",padding:14 }}>

                {/* Score gauge */}
                <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16,marginBottom:14,textAlign:"center" }}>
                  <div style={{ position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center",width:100,height:100,marginBottom:8 }}>
                    <svg width="100" height="100" viewBox="0 0 100 100">
                      <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="8"/>
                      <circle cx="50" cy="50" r="42" fill="none" stroke={scoreColor} strokeWidth="8"
                        strokeDasharray={`${2*Math.PI*42}`}
                        strokeDashoffset={`${2*Math.PI*42*(1-score/100)}`}
                        strokeLinecap="round"
                        transform="rotate(-90 50 50)"
                        style={{ transition:"stroke-dashoffset 1s ease" }}/>
                    </svg>
                    <div style={{ position:"absolute",textAlign:"center" }}>
                      <div className="mono" style={{ fontSize:22,fontWeight:700,color:scoreColor }}>{score}%</div>
                    </div>
                  </div>
                  <div style={{ fontSize:12,color:C.secondary }}>NIST CSF 2.0 Compliance</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:2 }}>{implemented} of {controls.length} controls</div>
                </div>

                {/* Per-function breakdown */}
                <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10 }}>By Function</div>
                {NIST_FUNCTIONS.map(fn=>{
                  const fnCtrls = controls.filter(c=>c.fn===fn.id);
                  const fnImpl  = fnCtrls.filter(c=>c.status==="Implemented").length;
                  const pct     = fnCtrls.length ? Math.round((fnImpl/fnCtrls.length)*100) : 0;
                  return (
                    <div key={fn.id} style={{ marginBottom:10 }}>
                      <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4 }}>
                        <span style={{ color:C.text }}><span className="mono" style={{ color:fn.color }}>{fn.id}</span> {fn.name}</span>
                        <span className="mono" style={{ color:C.subtle }}>{fnImpl}/{fnCtrls.length}</span>
                      </div>
                      <div style={{ height:5,background:"rgba(255,255,255,0.05)",borderRadius:3,overflow:"hidden" }}>
                        <div style={{ height:"100%",background:fn.color,borderRadius:3,width:`${pct}%`,transition:"width 0.8s ease",opacity:0.85 }}/>
                      </div>
                    </div>
                  );
                })}

                {/* Framework selector */}
                <div style={{ marginTop:16,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:12 }}>
                  <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8 }}>Frameworks</div>
                  {[["NIST CSF 2.0","Active",C.cyan],["ISO 27001","Phase 4",C.muted],["SOC 2 Type II","Phase 4",C.muted]].map(([f,s,c])=>(
                    <div key={f} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6 }}>
                      <span style={{ fontSize:12,color:C.text }}>{f}</span>
                      <span className="mono" style={{ fontSize:10,padding:"2px 6px",borderRadius:3,color:c,background:`${c}18`,border:`1px solid ${c}30` }}>{s}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // ── AI Analyst ────────────────────────────────────────────────────────────
    function AIAnalyst({ alert }) {
      const [status, setStatus] = useState("idle");
      const [parsed, setParsed] = useState(null);
      const [errMsg, setErrMsg] = useState("");
      useEffect(()=>{ setStatus("idle"); setParsed(null); setErrMsg(""); },[alert?.id]);

      const run = async () => {
        setStatus("loading"); setParsed(null); setErrMsg("");
        try {
          const res = await fetch(SUPABASE_URL, { method:"POST", headers:sbHeaders(), body:JSON.stringify({ alert }) });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || "Edge function error");
          setParsed(data.analysis);
          setStatus("done");
        } catch(e) { setErrMsg(e.message); setStatus("error"); }
      };

      if (!alert) return null;
      const vc = VCOLOR[parsed?.verdict] || VCOLOR.BENIGN;

      return (
        <div style={{ marginTop:16,borderTop:`1px solid ${C.border}`,paddingTop:16 }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12 }}>
            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill={C.purple}/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.636 5.636l2.121 2.121M16.243 16.243l2.121 2.121M5.636 18.364l2.121-2.121M16.243 7.757l2.121-2.121" stroke={C.purple} strokeWidth="1.5" strokeLinecap="round"/></svg>
              <span className="mono" style={{ fontSize:11,color:C.purple,textTransform:"uppercase",letterSpacing:"0.1em" }}>AI Analyst</span>
              {status==="loading" && <><Spinner/><span className="pulse" style={{ fontSize:11,color:C.subtle,marginLeft:4 }}>Analyzing...</span></>}
              {status==="done"    && <span className="mono" style={{ fontSize:11,padding:"2px 8px",borderRadius:4,background:C.greenDim,border:`1px solid rgba(74,222,128,0.3)`,color:C.green }}>Complete</span>}
            </div>
            {(status==="idle"||status==="error") &&
              <button type="button" onClick={run} aria-label="Run AI Analysis on this alert" style={{ padding:"6px 14px",borderRadius:6,fontSize:12,fontFamily:"IBM Plex Mono",cursor:"pointer",background:C.purpleDim,border:`1px solid rgba(167,139,250,0.4)`,color:C.purple,display:"flex",alignItems:"center",gap:6 }}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
                Run AI Analysis
              </button>
            }
            {status==="done" && <button type="button" onClick={()=>{setStatus("idle");setParsed(null);}} style={{ padding:"6px 14px",borderRadius:6,fontSize:12,background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,color:C.subtle,cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Re-run</button>}
          </div>

          {status==="idle" && <div style={{ borderRadius:8,border:`1px solid rgba(167,139,250,0.15)`,background:C.purpleDim,padding:12,fontSize:13,color:C.subtle }}>Click <strong style={{ color:C.purple }}>Run AI Analysis</strong> to trigger an autonomous investigation on this alert.</div>}
          {status==="loading" && (
            <div style={{ borderRadius:8,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:14,display:"flex",flexDirection:"column",gap:10 }}>
              {["Routing alert to AI analyst...","Enriching IOC context...","Mapping MITRE ATT&CK techniques...","Generating incident report..."].map((s,i)=>(
                <div key={i} className="pulse mono" style={{ display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.subtle,animationDelay:`${i*0.3}s` }}>
                  <span style={{ width:5,height:5,borderRadius:"50%",background:C.purple,display:"inline-block",flexShrink:0 }}/>{s}
                </div>
              ))}
            </div>
          )}
          {status==="error" && <div style={{ borderRadius:8,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:12,fontSize:12,color:"#f87171" }}><strong>Error:</strong> {errMsg}<div style={{ marginTop:6,fontSize:11,color:C.subtle }}>Check Supabase → Edge Functions → Logs for details.</div></div>}
          {status==="done" && parsed && (
            <div className="fade-in" style={{ display:"flex",flexDirection:"column",gap:10 }}>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
                <div style={{ borderRadius:8,border:`1px solid ${vc.b}`,background:vc.bg,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4 }}>Verdict</div>
                  <div className="mono" style={{ fontSize:15,fontWeight:700,color:vc.c }}>{parsed.verdict?.replace("_"," ")}</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:2 }}>Confidence: {parsed.confidence}%</div>
                </div>
                <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.card,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4 }}>Priority</div>
                  <div className="mono" style={{ fontSize:26,fontWeight:700,color:parsed.priority_score>=8?"#f87171":parsed.priority_score>=5?"#fbbf24":C.green }}>{parsed.priority_score}<span style={{ fontSize:13,color:C.muted }}>/10</span></div>
                  {parsed.escalate && <div style={{ fontSize:11,color:"#f87171",marginTop:2 }}>⚠ Escalate now</div>}
                </div>
              </div>
              {[["Summary",parsed.summary],["IOC Assessment",parsed.ioc_assessment]].map(([k,v])=>(
                <div key={k} style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.card,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6 }}>{k}</div>
                  <div style={{ fontSize:12,color:C.text,lineHeight:1.75 }}>{v}</div>
                </div>
              ))}
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
                <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.card,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6 }}>MITRE ATT&CK</div>
                  <div className="mono" style={{ fontSize:12,color:C.bright,marginBottom:3 }}>{parsed.mitre_tactic}</div>
                  <div style={{ fontSize:11,color:C.secondary }}>{parsed.mitre_technique}</div>
                </div>
                <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.card,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6 }}>Root Cause</div>
                  <div style={{ fontSize:12,color:C.text,lineHeight:1.6 }}>{parsed.root_cause}</div>
                </div>
              </div>
              <div style={{ borderRadius:8,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:12 }}>
                <div className="mono" style={{ fontSize:10,color:C.purple,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10 }}>Recommended Actions</div>
                {parsed.recommended_actions?.map((a,i)=>(
                  <div key={i} style={{ display:"flex",alignItems:"flex-start",gap:8,marginBottom:8 }}>
                    <span className="mono" style={{ width:18,height:18,borderRadius:"50%",background:C.purpleDim,border:`1px solid rgba(167,139,250,0.3)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:C.purple,flexShrink:0,marginTop:1 }}>{i+1}</span>
                    <span style={{ fontSize:12,color:C.text,lineHeight:1.6 }}>{a}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── SOAR Playbook ─────────────────────────────────────────────────────────
    const PHASE_COLOR = { Contain:"#f87171", Investigate:"#fbbf24", Eradicate:"#fb923c", Recover:"#4ade80", Report:C.cyan };

    function SOARPlaybook({ alert }) {
      const [status,   setStatus]   = useState("idle");
      const [playbook, setPlaybook] = useState(null);
      const [steps,    setSteps]    = useState({});
      const [errMsg,   setErrMsg]   = useState("");
      useEffect(()=>{ setStatus("idle"); setPlaybook(null); setSteps({}); setErrMsg(""); },[alert?.id]);

      const generate = async () => {
        setStatus("loading");
        try {
          const res = await fetch(SUPABASE_URL, {
            method:"POST", headers:sbHeaders(),
            body:JSON.stringify({ playbookRequest: {
              id:alert.id, severity:alert.severity, title:alert.title,
              tactic:alert.tactic, asset:alert.asset, ip:alert.ip,
              source:alert.source, description:alert.description
            }})
          });
          const data = await res.json();
          if (!res.ok||data.error) throw new Error(data.error||"Error");
          setPlaybook(data.playbook);
          const init = {};
          data.playbook?.steps?.forEach(s=>{ init[s.id]=false; });
          setSteps(init);
          setStatus("done");
        } catch(e) { setErrMsg(e.message); setStatus("error"); }
      };

      const completed = Object.values(steps).filter(Boolean).length;
      const total     = playbook?.steps?.length||0;
      const pct       = total ? Math.round((completed/total)*100) : 0;

      return (
        <div style={{ marginTop:16,borderTop:`1px solid ${C.border}`,paddingTop:16 }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12 }}>
            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3L22 4" stroke="#4ade80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="#4ade80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              <span className="mono" style={{ fontSize:11,color:"#4ade80",textTransform:"uppercase",letterSpacing:"0.1em" }}>SOAR Playbook</span>
              {status==="loading" && <Spinner/>}
              {status==="done" && <span style={{ fontSize:10,color:C.subtle }}>{completed}/{total} steps complete</span>}
            </div>
            {status==="idle" &&
              <button type="button" onClick={generate} style={{ padding:"5px 12px",borderRadius:5,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer",background:"rgba(74,222,128,0.1)",border:"1px solid rgba(74,222,128,0.3)",color:"#4ade80",display:"flex",alignItems:"center",gap:5 }}>
                <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
                Generate Playbook
              </button>
            }
            {status==="done" && <button type="button" onClick={()=>{setStatus("idle");setPlaybook(null);}} style={{ padding:"5px 12px",borderRadius:5,fontSize:11,background:"none",border:`1px solid ${C.border}`,color:C.subtle,cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Clear</button>}
          </div>

          {status==="idle" && <div style={{ borderRadius:7,border:"1px solid rgba(74,222,128,0.15)",background:"rgba(74,222,128,0.05)",padding:11,fontSize:12,color:C.subtle }}>Generate a step-by-step response playbook for this alert based on the MITRE tactic and severity.</div>}
          {status==="loading" && (
            <div style={{ borderRadius:7,border:"1px solid rgba(74,222,128,0.2)",background:"rgba(74,222,128,0.05)",padding:12,display:"flex",flexDirection:"column",gap:8 }}>
              {["Identifying MITRE technique...","Mapping response phases...","Generating step-by-step playbook..."].map((s,i)=>(
                <div key={i} className="pulse mono" style={{ display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.subtle,animationDelay:`${i*0.3}s` }}>
                  <span style={{ width:5,height:5,borderRadius:"50%",background:"#4ade80",display:"inline-block" }}/>{s}
                </div>
              ))}
            </div>
          )}
          {status==="error" && <div style={{ borderRadius:7,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:11,fontSize:12,color:"#f87171" }}>{errMsg}</div>}
          {status==="done" && playbook && (
            <div className="fade-in">
              {/* Header */}
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10 }}>
                <div>
                  <div style={{ fontSize:13,fontWeight:600,color:C.bright }}>{playbook.playbook_name}</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:2 }}>Est. {playbook.estimated_time} · {total} steps</div>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div className="mono" style={{ fontSize:18,fontWeight:700,color:pct===100?"#4ade80":"#fbbf24" }}>{pct}%</div>
                  <div style={{ fontSize:10,color:C.subtle }}>complete</div>
                </div>
              </div>
              {/* Progress bar */}
              <div style={{ height:4,background:"rgba(255,255,255,0.05)",borderRadius:2,overflow:"hidden",marginBottom:12 }}>
                <div style={{ height:"100%",background:pct===100?"#4ade80":"#fbbf24",borderRadius:2,width:`${pct}%`,transition:"width 0.4s ease" }}/>
              </div>
              {/* Steps */}
              {playbook.steps?.map(step=>{
                const done = steps[step.id];
                const pc = PHASE_COLOR[step.phase]||C.cyan;
                return (
                  <button key={step.id} type="button" onClick={()=>setSteps(prev=>({...prev,[step.id]:!prev[step.id]}))}
                    style={{ width:"100%",textAlign:"left",padding:"10px 12px",borderRadius:7,marginBottom:6,border:`1px solid ${done?"rgba(74,222,128,0.25)":C.border}`,background:done?"rgba(74,222,128,0.05)":"rgba(255,255,255,0.02)",cursor:"pointer",transition:"all 0.15s" }}>
                    <div style={{ display:"flex",alignItems:"flex-start",gap:10 }}>
                      <div style={{ width:18,height:18,borderRadius:"50%",border:`1px solid ${done?"#4ade80":C.border}`,background:done?"#4ade80":"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,transition:"all 0.2s" }}>
                        {done && <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#000" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </div>
                      <div style={{ flex:1,minWidth:0 }}>
                        <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:3 }}>
                          <span style={{ fontSize:9,fontFamily:"IBM Plex Mono",padding:"1px 5px",borderRadius:3,color:pc,background:`${pc}18`,border:`1px solid ${pc}30` }}>{step.phase.toUpperCase()}</span>
                          <span style={{ fontSize:10,color:C.subtle }}>Step {step.id}</span>
                          {step.tool && <span className="mono" style={{ fontSize:9,color:C.muted }}>via {step.tool}</span>}
                        </div>
                        <div style={{ fontSize:12,color:done?C.subtle:C.bright,textDecoration:done?"line-through":"none",lineHeight:1.4,transition:"color 0.2s" }}>{step.action}</div>
                        {step.details && !done && <div style={{ fontSize:11,color:C.subtle,marginTop:3,lineHeight:1.5 }}>{step.details}</div>}
                      </div>
                    </div>
                  </button>
                );
              })}
              {pct===100 && (
                <div style={{ borderRadius:7,border:"1px solid rgba(74,222,128,0.3)",background:"rgba(74,222,128,0.08)",padding:11,textAlign:"center" }}>
                  <div style={{ fontSize:13,color:"#4ade80",fontWeight:600 }}>✓ Playbook Complete</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:3 }}>All response steps completed — document in incident timeline</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── AlertRow ──────────────────────────────────────────────────────────────
    function AlertRow({ alert, onClick, selected, timeStr }) {
      const s  = SEV[alert.severity];
      const sc = STATUS_COLOR[alert.status] || C.subtle;
      return (
        <button type="button" onClick={()=>onClick(alert)} aria-label={`Alert ${alert.id}: ${alert.title}`}
          style={{ width:"100%",textAlign:"left",padding:"9px 10px",borderRadius:6,
            border:`1px solid ${selected ? s.border : C.border}`,
            borderLeft: selected ? `3px solid ${s.accent}` : `3px solid transparent`,
            background: selected ? s.bg : "rgba(255,255,255,0.01)",
            marginBottom:5,cursor:"pointer",transition:"all 0.15s"
          }}
          onMouseEnter={e=>{ if(!selected){ e.currentTarget.style.borderColor=C.border2; e.currentTarget.style.background=C.card; }}}
          onMouseLeave={e=>{ if(!selected){ e.currentTarget.style.borderColor=C.border; e.currentTarget.style.background="rgba(255,255,255,0.01)"; }}}
        >
          {/* Row 1: severity + id + time (always on one line) */}
          <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:4 }}>
            <span style={{ width:6,height:6,borderRadius:"50%",background:s.dot,display:"inline-block",flexShrink:0 }}/>
            <span className="mono" style={{ fontSize:10,fontWeight:700,color:s.text }}>{alert.severity}</span>
            <span className="mono" style={{ fontSize:10,color:C.muted }}>{alert.id}</span>
            <span style={{ marginLeft:"auto",fontSize:10,color:C.subtle,flexShrink:0 }}>{timeStr}</span>
          </div>
          {/* Row 2: title */}
          <div style={{ fontSize:12,color:C.bright,fontWeight:500,lineHeight:1.3,marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{alert.title}</div>
          {/* Row 3: asset + status badge (always on one line) */}
          <div style={{ display:"flex",alignItems:"center",gap:6 }}>
            {alert.live && <span className="mono" style={{ fontSize:9,padding:"1px 4px",borderRadius:2,color:"#4ade80",background:"rgba(74,222,128,0.1)",border:"1px solid rgba(74,222,128,0.3)",flexShrink:0 }}>LIVE</span>}
            <span style={{ fontSize:11,color:C.subtle,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{alert.asset}</span>
            {alert.status !== "Open" && (
              <span className="mono" style={{ marginLeft:"auto",fontSize:9,padding:"1px 5px",borderRadius:3,color:sc,background:`${sc}15`,border:`1px solid ${sc}30`,flexShrink:0,whiteSpace:"nowrap" }}>{alert.status}</span>
            )}
          </div>
        </button>
      );
    }

    // ── AlertDetail ───────────────────────────────────────────────────────────
    function AlertDetail({ alert, onTriage, onCreateIncident }) {
      if(!alert) return (
        <div style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",color:C.muted,gap:8 }}>
          <svg width="32" height="32" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" strokeWidth="1.5" d="M9 12h6m-3-3v6M12 3l1.5 2.5H18l-2 3 2 3h-4.5L12 14l-1.5-2.5H6l2-3-2-3h4.5L12 3z"/></svg>
          <span style={{ fontSize:12 }}>Select an alert to inspect</span>
        </div>
      );
      const s  = SEV[alert.severity];
      const sc = STATUS_COLOR[alert.status] || C.subtle;
      return (
        <div style={{ display:"flex",flexDirection:"column",gap:12 }}>
          {/* Header */}
          <div style={{ borderRadius:8,border:`1px solid ${s.border}`,background:s.bg,padding:12 }}>
            <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:6 }}>
              <span className="mono" style={{ fontSize:11,fontWeight:700,color:s.text,textTransform:"uppercase" }}>{alert.severity}</span>
              <span className="mono" style={{ fontSize:11,color:C.subtle }}>{alert.id}</span>
              <span style={{ marginLeft:"auto",fontSize:11,fontFamily:"IBM Plex Mono",padding:"2px 8px",borderRadius:4,color:sc,background:`${sc}18`,border:`1px solid ${sc}40` }}>{alert.status}</span>
            </div>
            <div style={{ fontSize:14,fontWeight:600,color:C.bright,marginBottom:10 }}>{alert.title}</div>
            {/* Triage Actions */}
            <div style={{ display:"flex",gap:6,flexWrap:"wrap",alignItems:"center" }}>
              {["Escalate","Investigate","Close","Assign"].map(action=>(
                <button key={action} type="button" onClick={()=>onTriage(action,alert)} style={{ padding:"4px 10px",fontSize:11,fontFamily:"IBM Plex Mono",borderRadius:4,cursor:"pointer",border:`1px solid ${C.border2}`,background:"rgba(255,255,255,0.04)",color:C.secondary,transition:"all 0.15s" }}
                  onMouseEnter={e=>{ e.currentTarget.style.background=C.cyanDim; e.currentTarget.style.color=C.cyan; e.currentTarget.style.borderColor="rgba(34,211,238,0.3)"; }}
                  onMouseLeave={e=>{ e.currentTarget.style.background="rgba(255,255,255,0.04)"; e.currentTarget.style.color=C.secondary; e.currentTarget.style.borderColor=C.border2; }}
                >{action}</button>
              ))}
              <div style={{ width:1,height:16,background:C.border,margin:"0 2px" }}/>
              <button type="button" onClick={()=>onCreateIncident&&onCreateIncident(alert)} style={{ padding:"4px 10px",fontSize:11,fontFamily:"IBM Plex Mono",borderRadius:4,cursor:"pointer",border:`1px solid rgba(167,139,250,0.4)`,background:C.purpleDim,color:C.purple }}>+ Incident</button>
            </div>
          </div>
          {/* Metadata */}
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
            {[["Asset",alert.asset],["Source",alert.source],["IP / Host",alert.ip],["Tactic",alert.tactic]].map(([k,v])=>(
              <div key={k} style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:8 }}>
                <div style={{ fontSize:11,color:C.subtle,marginBottom:2 }}>{k}</div>
                <div className="mono" style={{ fontSize:12,color:C.bright }}>{v}</div>
              </div>
            ))}
          </div>
          {/* Description */}
          <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:10 }}>
            <div style={{ fontSize:11,color:C.subtle,marginBottom:4 }}>Description</div>
            <div style={{ fontSize:12,color:C.secondary,lineHeight:1.75 }}>{alert.description}</div>
          </div>
          <AIAnalyst alert={alert}/>
          <SOARPlaybook alert={alert}/>
        </div>
      );
    }

    // ── IOCLookup ─────────────────────────────────────────────────────────────
    function IOCLookup() {
      const [q,       setQ]       = useState("");
      const [result,  setResult]  = useState(null);
      const [loading, setLoading] = useState(false);
      const [searched,setSearched]= useState(false);
      const [errMsg,  setErrMsg]  = useState("");

      const go = async () => {
        if (!q.trim()) return;
        setLoading(true); setSearched(true); setResult(null); setErrMsg("");
        try {
          const indicator = encodeURIComponent(q.trim().slice(0, 256));
          const res  = await fetch(`${SUPABASE_URL}?action=ioc&indicator=${indicator}`, { headers: sbHeaders() });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || "Lookup failed");
          setResult(data);
        } catch (e) {
          setErrMsg(e.message);
        }
        setLoading(false);
      };

      const r = result;
      const verdictColor = { MALICIOUS:"#f87171", SUSPICIOUS:"#fbbf24", CLEAN:"#4ade80", UNKNOWN:"#94a3b8" };
      const vc = r ? (verdictColor[r.verdict] || verdictColor.UNKNOWN) : "#94a3b8";

      return (
        <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
          <div style={{ display:"flex",gap:8,alignItems:"center" }}>
            <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>IOC Lookup</div>
            <span className="mono" style={{ fontSize:10,color:C.muted,background:C.card,border:`1px solid ${C.border}`,padding:"2px 6px",borderRadius:4 }}>AbuseIPDB · VirusTotal</span>
          </div>
          <div style={{ display:"flex",gap:8 }}>
            <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="IP, SHA256, domain..."
              aria-label="IOC Lookup input"
              style={{ flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 12px",fontSize:13,color:C.bright,fontFamily:"IBM Plex Mono" }}/>
            <button type="button" onClick={go} disabled={loading} style={{ padding:"8px 16px",background:C.cyanDim,border:`1px solid rgba(34,211,238,0.3)`,borderRadius:6,color:C.cyan,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>
              {loading ? "..." : "SCAN"}
            </button>
          </div>
          <div className="mono" style={{ fontSize:11,color:C.muted }}>IPv4 · SHA256 · MD5 · Domain</div>
          {loading && <div className="pulse" style={{ fontSize:12,color:C.subtle }}>Querying threat intel feeds...</div>}
          {errMsg  && <div style={{ borderRadius:7,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:10,fontSize:12,color:"#f87171" }}>{errMsg}</div>}
          {!loading && searched && r && (
            <div style={{ borderRadius:8,border:`1px solid ${vc}30`,background:`${vc}08`,padding:14 }}>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10 }}>
                <div>
                  <span className="mono" style={{ fontSize:16,fontWeight:700,color:vc }}>{r.verdict}</span>
                  {!r.hasRealData && <span style={{ fontSize:10,color:C.muted,marginLeft:8 }}>(demo data — add API keys for live results)</span>}
                </div>
                <span className="mono" style={{ fontSize:10,color:C.subtle,padding:"2px 7px",borderRadius:3,border:`1px solid ${C.border}` }}>{r.type}</span>
              </div>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:12 }}>
                {r.abuseScore !== undefined && <>
                  <div><span style={{ color:C.subtle }}>Abuse Score: </span><span className="mono" style={{ color:vc }}>{r.abuseScore}/100</span></div>
                  <div><span style={{ color:C.subtle }}>Reports: </span><span className="mono" style={{ color:C.text }}>{r.totalReports}</span></div>
                  <div><span style={{ color:C.subtle }}>Country: </span><span className="mono" style={{ color:C.text }}>{r.country}</span></div>
                  <div><span style={{ color:C.subtle }}>ISP: </span><span className="mono" style={{ color:C.text }}>{String(r.isp||"unknown").slice(0,30)}</span></div>
                  {r.usageType && <div style={{ gridColumn:"span 2" }}><span style={{ color:C.subtle }}>Usage: </span><span className="mono" style={{ color:C.text }}>{r.usageType}</span></div>}
                </>}
                {r.vtMalicious !== undefined && <>
                  <div><span style={{ color:C.subtle }}>VT Malicious: </span><span className="mono" style={{ color:r.vtMalicious>0?"#f87171":C.green }}>{r.vtMalicious}</span></div>
                  <div><span style={{ color:C.subtle }}>VT Clean: </span><span className="mono" style={{ color:C.text }}>{r.vtClean}</span></div>
                  {r.vtReputation !== 0 && <div><span style={{ color:C.subtle }}>Reputation: </span><span className="mono" style={{ color:C.text }}>{r.vtReputation}</span></div>}
                </>}
              </div>
              {Array.isArray(r.vtTags) && r.vtTags.length > 0 && (
                <div style={{ display:"flex",gap:4,flexWrap:"wrap",marginTop:8 }}>
                  {r.vtTags.map((t,i)=><span key={i} className="mono" style={{ fontSize:10,padding:"2px 6px",borderRadius:3,border:`1px solid ${C.border}`,color:C.secondary }}>{t}</span>)}
                </div>
              )}
              {r.lastSeen && <div style={{ fontSize:11,color:C.subtle,marginTop:6 }}>Last reported: {r.lastSeen}</div>}
            </div>
          )}
        </div>
      );
    }
    // ── CISAFeed ──────────────────────────────────────────────────────────────
    function CISAFeed({ vulns, loaded }) {
      if(!loaded) return <div className="pulse" style={{ fontSize:12,color:C.subtle,padding:"20px 0",textAlign:"center" }}>Loading CISA KEV feed...</div>;
      if(!vulns.length) return <div style={{ fontSize:12,color:C.subtle,padding:"20px 0",textAlign:"center" }}>No data available.</div>;
      return <div>{vulns.map((v,i)=>(
        <div key={i} style={{ display:"flex",alignItems:"flex-start",gap:12,padding:"7px 8px",borderRadius:4,marginBottom:2,borderLeft:"2px solid transparent",transition:"all 0.15s" }}
          onMouseEnter={e=>{ e.currentTarget.style.background=C.card; e.currentTarget.style.borderLeftColor="#dc2626"; }}
          onMouseLeave={e=>{ e.currentTarget.style.background="transparent"; e.currentTarget.style.borderLeftColor="transparent"; }}>
          <span className="mono" style={{ fontSize:11,color:"#f87171",flexShrink:0,width:112 }}>{v.cveID}</span>
          <div style={{ flex:1,minWidth:0 }}>
            <div style={{ fontSize:12,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{v.vendorProject} — {v.product}</div>
            <div style={{ fontSize:11,color:C.subtle,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{v.vulnerabilityName}</div>
          </div>
          <span className="mono" style={{ fontSize:11,color:C.muted,flexShrink:0 }}>{v.dateAdded}</span>
        </div>
      ))}</div>;
    }

    // ── App ───────────────────────────────────────────────────────────────────
    function App() {
      const [sel,       setSel]       = useState(ALERTS_RAW[0]);
      const [kevs,      setKevs]      = useState([]);
      const [loaded,    setLoaded]    = useState(false);
      const [tab,       setTab]       = useState("alerts");
      const [time,      setTime]      = useState(new Date());
      const [sideTab,   setSideTab]   = useState("dashboard");
      const [showAbout, setShowAbout] = useState(false);
      const [showKeys,  setShowKeys]  = useState(false);
      const [search,    setSearch]    = useState("");
      const [filter,    setFilter]    = useState(null);
      const [toast,     setToast]     = useState(null);
      const [alerts,    setAlerts]    = useState(ALERTS_RAW);
      const [dbReady,   setDbReady]   = useState(false);
      const [activity]              = useState([
        { id:"ALT-002", msg:"moved to Investigating", offsetMs:8*60*1000  },
        { id:"ALT-001", msg:"AI analysis completed",  offsetMs:11*60*1000 },
        { id:"ALT-005", msg:"moved to Investigating", offsetMs:31*60*1000 },
        { id:"ALT-003", msg:"flagged by EDR sensor",  offsetMs:15*60*1000 },
        { id:"ALT-004", msg:"brute force threshold",  offsetMs:22*60*1000 },
      ]);
      const searchRef = useRef(null);

      // ── Load alerts from Supabase on mount ──────────────────────────────────
      useEffect(()=>{
        (async ()=>{
          try {
            const res = await fetch(
              `https://xkadqvmqxdyqoddiypet.supabase.co/rest/v1/soc_alerts?select=*&order=created_at.desc&limit=50`,
              { headers:{ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}` } }
            );
            if (!res.ok) throw new Error("Table not found");
            const rows = await res.json();
            if (Array.isArray(rows) && rows.length > 0) {
              const mapped = rows.map(r=>({
                id:r.id, title:r.title, severity:r.severity, status:r.status,
                source:r.source||"SIEM", asset:r.asset||"—", ip:r.ip||"—",
                tactic:r.tactic||"Unknown", description:r.description||"",
                offsetMs:Number(r.offset_ms)||0, live:r.live||false
              }));
              setAlerts(mapped);
              setSel(mapped[0]);
            } else {
              // Seed Supabase with mock alerts
              await seedAlertsToDb(ALERTS_RAW);
            }
            setDbReady(true);
          } catch {
            setDbReady(false); // fall back to mock data silently
          }
        })();
      },[]);

      // ── Seed helper ──────────────────────────────────────────────────────────
      const seedAlertsToDb = async (alertList) => {
        try {
          await fetch(
            `https://xkadqvmqxdyqoddiypet.supabase.co/rest/v1/soc_alerts`,
            {
              method:"POST",
              headers:{ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
              body: JSON.stringify(alertList.map(a=>({ id:a.id, title:a.title, severity:a.severity, status:a.status, source:a.source, asset:a.asset, ip:a.ip, tactic:a.tactic, description:a.description, offset_ms:a.offsetMs, live:false })))
            }
          );
        } catch {}
      };

      // ── Persist triage to Supabase ────────────────────────────────────────
      const persistTriage = async (alertId, newStatus) => {
        if (!dbReady) return;
        try {
          await fetch(
            `https://xkadqvmqxdyqoddiypet.supabase.co/rest/v1/soc_alerts?id=eq.${alertId}`,
            {
              method:"PATCH",
              headers:{ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}`, "Content-Type":"application/json" },
              body: JSON.stringify({ status:newStatus })
            }
          );
        } catch {}
      };

      // ── Fetch live OTX alerts ─────────────────────────────────────────────
      useEffect(()=>{
        (async ()=>{
          try {
            const res = await fetch(`${SUPABASE_URL}?action=otx`,{ headers:sbHeaders() });
            if (!res.ok) return;
            const data = await res.json();
            if (!Array.isArray(data.alerts)||!data.alerts.length) return;
            setAlerts(prev=>{
              const existing = new Set(prev.map(a=>a.id));
              const fresh = data.alerts.filter(a=>!existing.has(a.id));
              if (!fresh.length) return prev;
              const merged = [...fresh,...prev];
              setToast(`${fresh.length} live alert${fresh.length>1?"s":""} from OTX`);
              setSel(s=>s||merged[0]);
              if (dbReady) seedAlertsToDb(fresh);
              return merged;
            });
          } catch {}
        })();
      },[dbReady]);

      useEffect(()=>{ const t=setInterval(()=>setTime(new Date()),1000); return()=>clearInterval(t); },[]);

      // Keyboard shortcuts
      useEffect(()=>{
        const handler = (e) => {
          const tag = document.activeElement?.tagName;
          if (tag==="INPUT" || tag==="TEXTAREA") return;
          const visible = alerts.filter(a => {
            const ms = !search || a.title.toLowerCase().includes(search.toLowerCase()) || a.asset.toLowerCase().includes(search.toLowerCase());
            const mf = !filter || (filter==="Open" ? a.status==="Open" : a.severity===filter);
            return ms && mf;
          });
          const idx = visible.findIndex(a=>a.id===sel?.id);
          if (e.key==="j" || e.key==="ArrowDown") { e.preventDefault(); if(idx<visible.length-1) setSel(visible[idx+1]); }
          if (e.key==="k" || e.key==="ArrowUp")   { e.preventDefault(); if(idx>0) setSel(visible[idx-1]); }
          if (e.key==="Escape") setSel(null);
          if (e.key==="/") { e.preventDefault(); searchRef.current?.focus(); }
          if (e.key==="?") setShowKeys(s=>!s);
        };
        window.addEventListener("keydown", handler);
        return()=>window.removeEventListener("keydown",handler);
      },[sel, alerts, search, filter]);
      useEffect(()=>{
        fetch(`${SUPABASE_URL}?action=cisa`,{ headers:sbHeaders() })
          .then(r=>r.json())
          .then(d=>{ if(d.vulnerabilities){ setKevs([...d.vulnerabilities].sort((a,b)=>new Date(b.dateAdded)-new Date(a.dateAdded)).slice(0,25)); } setLoaded(true); })
          .catch(()=>setLoaded(true));
      },[]);

      const handleTriage = (action, alert) => {
        if (action === "Investigate") {
          setAlerts(prev => prev.map(a => a.id===alert.id ? {...a, status:"Investigating"} : a));
          setSel(prev => prev?.id===alert.id ? {...prev, status:"Investigating"} : prev);
          persistTriage(alert.id, "Investigating");
          setToast(`${alert.id} → Investigating`);
        } else if (action === "Close") {
          setAlerts(prev => prev.map(a => a.id===alert.id ? {...a, status:"Closed"} : a));
          setSel(prev => prev?.id===alert.id ? {...prev, status:"Closed"} : prev);
          persistTriage(alert.id, "Closed");
          setToast(`${alert.id} closed`);
        } else if (action === "Escalate") {
          setAlerts(prev => prev.map(a => a.id===alert.id ? {...a, status:"Escalated"} : a));
          setSel(prev => prev?.id===alert.id ? {...prev, status:"Escalated"} : prev);
          persistTriage(alert.id, "Escalated");
          setToast(`${alert.id} → Escalated`);
        } else if (action === "Assign") {
          setToast(`${alert.id} assigned to M. Mohamud`);
        } else {
          setToast(`${alert.id} — ${action}`);
        }
      };

      const statFilter = (label) => {
        if (label==="Critical") setFilter(f => f==="CRITICAL" ? null : "CRITICAL");
        else if (label==="High") setFilter(f => f==="HIGH" ? null : "HIGH");
        else if (label==="Open") setFilter(f => f==="Open" ? null : "Open");
        else setFilter(null);
      };

      const filteredAlerts = alerts.filter(a => {
        const matchSearch = !search || a.title.toLowerCase().includes(search.toLowerCase()) || a.asset.toLowerCase().includes(search.toLowerCase()) || a.source.toLowerCase().includes(search.toLowerCase());
        const matchFilter = !filter || (filter==="Open" ? a.status==="Open" : a.severity===filter);
        return matchSearch && matchFilter;
      });

      const critical = alerts.filter(a=>a.severity==="CRITICAL" && a.status!=="Closed").length;
      const high     = alerts.filter(a=>a.severity==="HIGH" && a.status!=="Closed").length;
      const open     = alerts.filter(a=>a.status==="Open").length;

      const threatLevel = critical > 0 ? "CRITICAL" : high >= 2 ? "HIGH" : high === 1 ? "MEDIUM" : "LOW";
      const threatColor = { CRITICAL:"#dc2626", HIGH:"#f97316", MEDIUM:"#fbbf24", LOW:"#4ade80" }[threatLevel];

      const stats = [
        { label:"Total Alerts", value:alerts.length, sub:"Last 24h",        filterKey:null     },
        { label:"Critical",     value:critical,       sub:"Immediate action", filterKey:"Critical" },
        { label:"High",         value:high,           sub:"Needs review",    filterKey:"High"   },
        { label:"Open",         value:open,           sub:"Unresolved",      filterKey:"Open"   },
      ];

      const HEADER_H = 49;

      const ShortcutsModal = () => {
        useEffect(()=>{
          const h = e => { if(e.key==="Escape") setShowKeys(false); };
          window.addEventListener("keydown", h);
          return()=>window.removeEventListener("keydown", h);
        },[]);
        return (
        <div onClick={e=>{ e.stopPropagation(); setShowKeys(false); }} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center" }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:C.surface,border:`1px solid ${C.border2}`,borderRadius:12,padding:24,minWidth:320,boxShadow:"0 24px 64px rgba(0,0,0,0.5)" }}>
            <div className="mono" style={{ fontSize:13,color:C.cyan,marginBottom:16,letterSpacing:"0.1em" }}>KEYBOARD SHORTCUTS</div>
            {[["j / ↓","Next alert"],["k / ↑","Previous alert"],["Escape","Deselect alert"],["/ ","Focus search"],["?","Toggle this overlay"]].map(([k,v])=>(
              <div key={k} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10 }}>
                <span className="mono" style={{ fontSize:12,background:C.card,border:`1px solid ${C.border2}`,borderRadius:4,padding:"2px 8px",color:C.cyan }}>{k}</span>
                <span style={{ fontSize:12,color:C.secondary }}>{v}</span>
              </div>
            ))}
            <div style={{ marginTop:14,fontSize:11,color:C.muted,textAlign:"center" }}>Press ? or Escape to close</div>
          </div>
        </div>
        );
      };

      return (
        <div style={{ height:"100vh",overflow:"hidden",background:C.bg,color:C.text,display:"flex",flexDirection:"column",backgroundImage:"radial-gradient(ellipse at top left,rgba(0,180,255,0.04) 0%,transparent 50%),radial-gradient(ellipse at bottom right,rgba(167,139,250,0.03) 0%,transparent 50%)" }}>

          {showAbout && <AboutModal onClose={()=>setShowAbout(false)}/>}
          {showKeys  && <ShortcutsModal/>}
          {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}

          {/* Header */}
          <header style={{ height:HEADER_H,borderBottom:`1px solid ${C.border}`,padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(8,13,20,0.9)",backdropFilter:"blur(8px)",flexShrink:0,zIndex:50,gap:12 }}>
            <div style={{ display:"flex",alignItems:"center",gap:12,flexShrink:0 }}>
              <span className="mono" style={{ fontSize:14,fontWeight:700,letterSpacing:"0.08em",color:C.cyan,whiteSpace:"nowrap" }}>SENTINEL<span style={{ color:C.bright }}>IQ</span></span>
              <span className="header-title-sub" style={{ fontSize:11,color:C.muted,whiteSpace:"nowrap" }}>SOC Platform v2.0</span>
              <span style={{ fontSize:11,fontFamily:"IBM Plex Mono",padding:"2px 8px",borderRadius:4,background:`${threatColor}18`,border:`1px solid ${threatColor}40`,color:threatColor,whiteSpace:"nowrap" }}>● {threatLevel}</span>
            </div>
            <div className="header-feeds" style={{ display:"flex",alignItems:"center",gap:12,overflow:"hidden",flexWrap:"nowrap" }}>
              {FEEDS.map(f=>(
                <div key={f.name} style={{ display:"flex",alignItems:"center",gap:5,flexShrink:0 }}>
                  <Dot live={f.live} tip={f.tip}/>
                  <span className="feed-label" style={{ fontSize:11,color:f.live?C.cyan:"#fbbf24",whiteSpace:"nowrap" }}>{f.name}</span>
                </div>
              ))}
              <div style={{ display:"flex",alignItems:"center",gap:5,flexShrink:0 }}>
                <Dot live={true} tip="AI Analyst active via Supabase"/>
                <span className="feed-label" style={{ fontSize:11,color:C.green }}>AI Analyst</span>
              </div>
              <div style={{ display:"flex",alignItems:"center",gap:5,flexShrink:0 }}>
                <Dot live={dbReady} tip={dbReady?"Alert persistence active":"Using local data"}/>
                <span className="feed-label" style={{ fontSize:11,color:dbReady?C.green:"#fbbf24" }}>Supabase</span>
              </div>
            </div>
            <div style={{ display:"flex",alignItems:"center",gap:10,flexShrink:0 }}>
              <span className="header-clock mono" style={{ fontSize:11,color:C.muted,whiteSpace:"nowrap" }}>{time.toUTCString().slice(0,-4)} UTC</span>
              <button type="button" onClick={()=>setShowKeys(true)} title="Keyboard shortcuts (?)" style={{ background:"none",border:`1px solid ${C.border}`,borderRadius:4,color:C.subtle,fontSize:11,padding:"2px 6px",cursor:"pointer",fontFamily:"IBM Plex Mono" }}>?</button>
              <AvatarMenu onAbout={()=>setShowAbout(true)} onSettings={()=>setSideTab("settings")}/>
            </div>
          </header>

          {/* Stats Bar — only on Alert Queue tab */}
          {sideTab==="alerts" && (
          <div style={{ height:80,padding:"10px 16px 10px 8px",display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,borderBottom:`1px solid ${C.border}`,flexShrink:0 }}>
            {stats.map(s=>{
              const sc = STAT_COLORS[s.label] || { c:C.bright, bg:C.card };
              const isActive = (filter==="CRITICAL"&&s.label==="Critical")||(filter==="HIGH"&&s.label==="High")||(filter==="Open"&&s.label==="Open");
              return (
                <button key={s.label} type="button" onClick={()=>statFilter(s.label)} aria-label={`Filter by ${s.label}`}
                  style={{ background:isActive?`${sc.bg}`:C.card,border:`1px solid ${isActive?C.border2:C.border}`,borderRadius:8,padding:"8px 12px",cursor:s.filterKey?"pointer":"default",transition:"all 0.15s",textAlign:"left",outline:"none" }}>
