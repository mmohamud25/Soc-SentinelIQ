                </div>
              </div>
            )}

            {detailTab==="ai"       && <AIAnalyst alert={alert}/>}
            {detailTab==="playbook" && <SOARPlaybook alert={alert}/>}
            {detailTab==="notes"    && <AnalystNotes alert={alert}/>}

          </div>
        </div>
      );
    }

    // ── IOCLookup ─────────────────────────────────────────────────────────────
    function IOCLookup() {
      const [q,       setQ]       = useState("");
      const [result,  setResult]  = useState(null);
      const [loading, setLoading] = useState(false);
      const [searched,setSearched]= useState(false);
      const [errMsg,  setErrMsg]  = useState("");

      const go = async () => {
        if (!q.trim()) return;
        setLoading(true); setSearched(true); setResult(null); setErrMsg("");
        try {
          const indicator = encodeURIComponent(q.trim().slice(0, 256));
          const res  = await fetch(`${SUPABASE_URL}?action=ioc&indicator=${indicator}`, { headers: sbHeaders() });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || "Lookup failed");
          setResult(data);
        } catch (e) {
          setErrMsg(e.message);
        }
        setLoading(false);
      };

      const r = result;
      const verdictColor = { MALICIOUS:"#f87171", SUSPICIOUS:"#fbbf24", CLEAN:"#4ade80", UNKNOWN:"#94a3b8" };
      const vc = r ? (verdictColor[r.verdict] || verdictColor.UNKNOWN) : "#94a3b8";

      return (
        <div style={{ display:"flex",flexDirection:"column",gap:8 }}>
          <div style={{ display:"flex",gap:8 }}>
            <label htmlFor="ioc-input" style={{ display:"block",fontSize:11,color:C.subtle,marginBottom:4 }}>Indicator (IP, hash, or domain)</label>
          <input id="ioc-input" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="IP, SHA256, domain..."
              aria-label="IOC Lookup input"
              style={{ flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 12px",fontSize:13,color:C.bright,fontFamily:"IBM Plex Mono" }}/>
            <button type="button" onClick={go} disabled={loading} style={{ padding:"8px 16px",background:C.cyanDim,border:`1px solid rgba(34,211,238,0.3)`,borderRadius:6,color:C.cyan,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>
              {loading ? "..." : "SCAN"}
            </button>
          </div>
          <div className="mono" style={{ fontSize:11,color:C.muted }}>IPv4 · SHA256 · MD5 · Domain</div>
          {loading && <div className="pulse" style={{ fontSize:12,color:C.subtle }}>Querying threat intel feeds...</div>}
          {errMsg  && <div style={{ borderRadius:7,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:10,fontSize:12,color:"#f87171" }}>{errMsg}</div>}
          {!loading && searched && r && (
            <div style={{ borderRadius:8,border:`1px solid ${vc}30`,background:`${vc}08`,padding:14 }}>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10 }}>
                <div>
                  <span className="mono" style={{ fontSize:16,fontWeight:700,color:vc }}>{r.verdict}</span>
                  {!r.hasRealData && <span style={{ fontSize:10,color:C.muted,marginLeft:8 }}>(demo data — add API keys for live results)</span>}
                </div>
                <span className="mono" style={{ fontSize:10,color:C.subtle,padding:"2px 7px",borderRadius:3,border:`1px solid ${C.border}` }}>{r.type}</span>
              </div>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:12 }}>
                {r.abuseScore !== undefined && <>
                  <div><span style={{ color:C.subtle }}>Abuse Score: </span><span className="mono" style={{ color:vc }}>{r.abuseScore}/100</span></div>
                  <div><span style={{ color:C.subtle }}>Reports: </span><span className="mono" style={{ color:C.text }}>{r.totalReports}</span></div>
                  <div><span style={{ color:C.subtle }}>Country: </span><span className="mono" style={{ color:C.text }}>{r.country}</span></div>
                  <div><span style={{ color:C.subtle }}>ISP: </span><span className="mono" style={{ color:C.text }}>{String(r.isp||"unknown").slice(0,30)}</span></div>
                  {r.usageType && <div style={{ gridColumn:"span 2" }}><span style={{ color:C.subtle }}>Usage: </span><span className="mono" style={{ color:C.text }}>{r.usageType}</span></div>}
                </>}
                {r.vtMalicious !== undefined && <>
                  <div><span style={{ color:C.subtle }}>VT Malicious: </span><span className="mono" style={{ color:r.vtMalicious>0?"#f87171":C.green }}>{r.vtMalicious}</span></div>
                  <div><span style={{ color:C.subtle }}>VT Clean: </span><span className="mono" style={{ color:C.text }}>{r.vtClean}</span></div>
                  {r.vtReputation !== 0 && <div><span style={{ color:C.subtle }}>Reputation: </span><span className="mono" style={{ color:C.text }}>{r.vtReputation}</span></div>}
                </>}
              </div>
              {Array.isArray(r.vtTags) && r.vtTags.length > 0 && (
                <div style={{ display:"flex",gap:4,flexWrap:"wrap",marginTop:8 }}>
                  {r.vtTags.map((t,i)=><span key={i} className="mono" style={{ fontSize:10,padding:"2px 6px",borderRadius:3,border:`1px solid ${C.border}`,color:C.secondary }}>{t}</span>)}
                </div>
              )}
              {r.lastSeen && <div style={{ fontSize:11,color:C.subtle,marginTop:6 }}>Last reported: {r.lastSeen}</div>}
            </div>
          )}
        </div>
      );
    }
    // ── CISAFeed ──────────────────────────────────────────────────────────────
    function CISAFeed({ vulns, loaded, alerts }) {
      if(!loaded) return <div className="pulse" style={{ fontSize:12,color:C.subtle,padding:"20px 0",textAlign:"center" }}>Loading CISA KEV feed...</div>;
      if(!vulns.length) return <div style={{ fontSize:12,color:C.subtle,padding:"20px 0",textAlign:"center" }}>No data available.</div>;

      // Map CVEs to alerts by product/vendor name matching asset or description
      const matchAlerts = (vuln) => {
        const terms = [vuln.product, vuln.vendorProject].map(t=>(t||"").toLowerCase()).filter(Boolean);
        return (alerts||[]).filter(a => {
          const hay = `${a.asset} ${a.title} ${a.description} ${a.source}`.toLowerCase();
          return terms.some(t => t.length > 3 && hay.includes(t));
        });
      };

      return (
        <div>
          <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"8px 10px",background:C.card,borderRadius:7,border:`1px solid ${C.border}` }}>
            <Dot live={true}/>

    // ── App ───────────────────────────────────────────────────────────────────
    function App() {
      const DEFAULT_ANALYST = ANALYSTS[0]; // Mohamed Mohamud
      const [analyst, setAnalyst] = useState(()=>{
        try {
          const s = localStorage.getItem("siq_analyst");
          return s ? JSON.parse(s) : DEFAULT_ANALYST;
        } catch { return DEFAULT_ANALYST; }
      });
      const handleLogin  = (a) => { localStorage.setItem("siq_analyst",JSON.stringify(a)); setAnalyst(a); };
      const handleLogout = () => { localStorage.setItem("siq_analyst",JSON.stringify(DEFAULT_ANALYST)); setAnalyst(DEFAULT_ANALYST); };

      const [sel,       setSel]       = useState(ALERTS_RAW[0]);
      const [kevs,      setKevs]      = useState([]);
      const [loaded,    setLoaded]    = useState(false);
      const [tab,       setTab]       = useState("alerts");
      const [time,      setTime]      = useState(new Date());
      const [sideTab,   setSideTab]   = useState("dashboard");
      const [showAbout,    setShowAbout]    = useState(false);
      const [showKeys,     setShowKeys]     = useState(false);
      const [showOnboard,  setShowOnboard]  = useState(()=>!localStorage.getItem("siq_onboarded"));
      const [showPicker,   setShowPicker]   = useState(false);
      const closeOnboard = () => { localStorage.setItem("siq_onboarded","1"); setShowOnboard(false); };
      const [search,    setSearch]    = useState("");
      const [filter,    setFilter]    = useState(null);
      const [toast,     setToast]     = useState(null);
      const [alerts,    setAlerts]    = useState(ALERTS_RAW);
      const [dbReady,   setDbReady]   = useState(false);
      const [rtStatus,  setRtStatus]  = useState("connecting"); // connecting | live | error
      const pendingLocal = useRef(new Set()); // track our own triage changes
      const [activity]              = useState([
        { id:"ALT-002", msg:"moved to Investigating", offsetMs:8*60*1000  },
        { id:"ALT-001", msg:"AI analysis completed",  offsetMs:11*60*1000 },
        { id:"ALT-005", msg:"moved to Investigating", offsetMs:31*60*1000 },
        { id:"ALT-003", msg:"flagged by EDR sensor",  offsetMs:15*60*1000 },
        { id:"ALT-004", msg:"brute force threshold",  offsetMs:22*60*1000 },
      ]);
      const searchRef = useRef(null);

      // ── Load alerts from Supabase on mount ──────────────────────────────────
      useEffect(()=>{
        (async ()=>{
          try {
            const res = await fetch(
              `https://xkadqvmqxdyqoddiypet.supabase.co/rest/v1/soc_alerts?select=*&order=created_at.desc&limit=50`,
              { headers:{ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}` } }
            );
            if (!res.ok) throw new Error("Table not found");
            const rows = await res.json();
            if (Array.isArray(rows) && rows.length > 0) {
              const mapped = rows.map(r=>({
                id:r.id, title:r.title, severity:r.severity, status:r.status,
                source:r.source||"SIEM", asset:r.asset||"—", ip:r.ip||"—",
                tactic:r.tactic||"Unknown", description:r.description||"",
                offsetMs:Number(r.offset_ms)||0, live:r.live||false
              }));
              setAlerts(mapped);
              setSel(mapped[0]);
            } else {
              // Seed Supabase with mock alerts
              await seedAlertsToDb(ALERTS_RAW);
            }
            setDbReady(true);
          } catch {
            setDbReady(false); // fall back to mock data silently
          }
        })();
      },[]);

      // ── Seed helper ──────────────────────────────────────────────────────────
      const seedAlertsToDb = async (alertList) => {
        try {
          await fetch(
            `https://xkadqvmqxdyqoddiypet.supabase.co/rest/v1/soc_alerts`,
            {
              method:"POST",
              headers:{ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" },
              body: JSON.stringify(alertList.map(a=>({ id:a.id, title:a.title, severity:a.severity, status:a.status, source:a.source, asset:a.asset, ip:a.ip, tactic:a.tactic, description:a.description, offset_ms:a.offsetMs, live:false })))
            }
          );
        } catch {}
      };

      // ── Persist triage to Supabase ────────────────────────────────────────
      const persistTriage = async (alertId, newStatus) => {
        if (!dbReady) return;
        try {
          await fetch(
            `https://xkadqvmqxdyqoddiypet.supabase.co/rest/v1/soc_alerts?id=eq.${alertId}`,
            {
              method:"PATCH",
              headers:{ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}`, "Content-Type":"application/json" },
              body: JSON.stringify({ status:newStatus })
            }
          );
        } catch {}
      };

      // ── Fetch live OTX alerts ─────────────────────────────────────────────
      useEffect(()=>{
        (async ()=>{
          try {
            const res = await fetch(`${SUPABASE_URL}?action=otx`,{ headers:sbHeaders() });
            if (!res.ok) return;
            const data = await res.json();
            if (!Array.isArray(data.alerts)||!data.alerts.length) return;
            setAlerts(prev=>{
              const existing = new Set(prev.map(a=>a.id));
              const fresh = data.alerts.filter(a=>!existing.has(a.id));
              if (!fresh.length) return prev;
              const merged = [...fresh,...prev];
              setToast(`${fresh.length} live alert${fresh.length>1?"s":""} from OTX`);
              setSel(s=>s||merged[0]);
              if (dbReady) seedAlertsToDb(fresh);
              return merged;
            });
          } catch {}
        })();
      },[dbReady]);

      useEffect(()=>{ const t=setInterval(()=>setTime(new Date()),1000); return()=>clearInterval(t); },[]);

      // Keyboard shortcuts
      useEffect(()=>{
        const handler = (e) => {
          const tag = document.activeElement?.tagName;
          if (tag==="INPUT" || tag==="TEXTAREA") return;
          const visible = alerts.filter(a => {
            const ms = !search || a.title.toLowerCase().includes(search.toLowerCase()) || a.asset.toLowerCase().includes(search.toLowerCase());
            const mf = !filter || (filter==="Open" ? a.status==="Open" : a.severity===filter);
            return ms && mf;
          });
          const idx = visible.findIndex(a=>a.id===sel?.id);
          if (e.key==="j" || e.key==="ArrowDown") { e.preventDefault(); if(idx<visible.length-1) setSel(visible[idx+1]); }
          if (e.key==="k" || e.key==="ArrowUp")   { e.preventDefault(); if(idx>0) setSel(visible[idx-1]); }
          if (e.key==="Escape") setSel(null);
          if (e.key==="/") { e.preventDefault(); searchRef.current?.focus(); }
          if (e.key==="?") setShowKeys(s=>!s);
        };
        window.addEventListener("keydown", handler);
        return()=>window.removeEventListener("keydown",handler);
      },[sel, alerts, search, filter]);
      useEffect(()=>{
        fetch(`${SUPABASE_URL}?action=cisa`,{ headers:sbHeaders() })
          .then(r=>r.json())
          .then(d=>{ if(d.vulnerabilities){ setKevs([...d.vulnerabilities].sort((a,b)=>new Date(b.dateAdded)-new Date(a.dateAdded)).slice(0,25)); } setLoaded(true); })
          .catch(()=>setLoaded(true));
      },[]);

      // ── Supabase Realtime ──────────────────────────────────────────────────
      useEffect(()=>{
        const channel = sbClient
          .channel("soc_alerts_realtime")
          .on("postgres_changes", { event:"UPDATE", schema:"public", table:"soc_alerts" }, (payload) => {
            const updated = payload.new;
            if (!updated?.id) return;

            // Skip if this was our own triage action (avoid double-toast)
            if (pendingLocal.current.has(updated.id)) {
              pendingLocal.current.delete(updated.id);
              return;
            }

            // Another session changed an alert — sync state
            setAlerts(prev => prev.map(a =>
              a.id === updated.id
                ? { ...a, status:updated.status, notes:updated.notes||a.notes }
                : a
            ));
            setSel(prev =>
              prev?.id === updated.id
                ? { ...prev, status:updated.status }
                : prev
            );
            setToast(`↻ Realtime: ${updated.id} → ${updated.status}`);
          })
          .on("postgres_changes", { event:"INSERT", schema:"public", table:"soc_alerts" }, (payload) => {
            const a = payload.new;
            if (!a?.id) return;
            const newAlert = {
              id:a.id, title:a.title, severity:a.severity, status:a.status,
              source:a.source||"External", asset:a.asset||"—", ip:a.ip||"—",
              tactic:a.tactic||"Unknown", description:a.description||"",
              offsetMs:Number(a.offset_ms)||0, live:a.live||false,
            };
            setAlerts(prev => {
              if (prev.find(x=>x.id===newAlert.id)) return prev;
              setToast(`↻ Realtime: new alert ${newAlert.id}`);
              return [newAlert, ...prev];
            });
          })
          .subscribe((status) => {
            setRtStatus(status === "SUBSCRIBED" ? "live" : status === "CHANNEL_ERROR" ? "error" : "connecting");
          });

        return () => sbClient.removeChannel(channel);
      }, []);

      // Mark local triage so Realtime echo is ignored
      const markLocal = (alertId) => pendingLocal.current.add(alertId);

      const handleTriage = (action, alert) => {
        if (action === "Investigate") {
          markLocal(alert.id);
          setAlerts(prev => prev.map(a => a.id===alert.id ? {...a, status:"Investigating"} : a));
          setSel(prev => prev?.id===alert.id ? {...prev, status:"Investigating"} : prev);
          persistTriage(alert.id, "Investigating");
          setToast(`${alert.id} → Investigating`);
        } else if (action === "Close") {
          markLocal(alert.id);
          setAlerts(prev => prev.map(a => a.id===alert.id ? {...a, status:"Closed"} : a));
          setSel(prev => prev?.id===alert.id ? {...prev, status:"Closed"} : prev);
          persistTriage(alert.id, "Closed");
          setToast(`${alert.id} closed`);
        } else if (action === "Escalate") {
          markLocal(alert.id);
          setAlerts(prev => prev.map(a => a.id===alert.id ? {...a, status:"Escalated"} : a));
          setSel(prev => prev?.id===alert.id ? {...prev, status:"Escalated"} : prev);
          persistTriage(alert.id, "Escalated");
          setToast(`${alert.id} → Escalated`);
        } else if (action === "Assign") {
          setToast(`${alert.id} assigned to ${analyst?.name||"analyst"}`);
        } else {
          setToast(`${alert.id} — ${action}`);
        }
      };

      const statFilter = (label) => {
        if (label==="Critical") setFilter(f => f==="CRITICAL" ? null : "CRITICAL");
        else if (label==="High") setFilter(f => f==="HIGH" ? null : "HIGH");
        else if (label==="Open") setFilter(f => f==="Open" ? null : "Open");
        else setFilter(null);
      };

      const filteredAlerts = alerts.filter(a => {
        const matchSearch = !search || a.title.toLowerCase().includes(search.toLowerCase()) || a.asset.toLowerCase().includes(search.toLowerCase()) || a.source.toLowerCase().includes(search.toLowerCase());
        const matchFilter = !filter || (filter==="Open" ? a.status==="Open" : a.severity===filter);
        return matchSearch && matchFilter;
      });

      const critical = alerts.filter(a=>a.severity==="CRITICAL" && a.status!=="Closed").length;
      const high     = alerts.filter(a=>a.severity==="HIGH" && a.status!=="Closed").length;
      const open     = alerts.filter(a=>a.status==="Open").length;

      const threatLevel = critical > 0 ? "CRITICAL" : high >= 2 ? "HIGH" : high === 1 ? "MEDIUM" : "LOW";
      const threatColor = { CRITICAL:"#dc2626", HIGH:"#f97316", MEDIUM:"#fbbf24", LOW:"#4ade80" }[threatLevel];

      const stats = [
        { label:"Total Alerts", value:alerts.length, sub:"Last 24h",        filterKey:null     },
        { label:"Critical",     value:critical,       sub:"Immediate action", filterKey:"Critical" },
        { label:"High",         value:high,           sub:"Needs review",    filterKey:"High"   },
        { label:"Open",         value:open,           sub:"Unresolved",      filterKey:"Open"   },
      ];

      const HEADER_H = 49;

      const ShortcutsModal = () => {
        useEffect(()=>{
          const h = e => { if(e.key==="Escape") setShowKeys(false); };
          window.addEventListener("keydown", h);
          return()=>window.removeEventListener("keydown", h);
        },[]);
        return (
        <div onClick={e=>{ e.stopPropagation(); setShowKeys(false); }} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center" }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:C.surface,border:`1px solid ${C.border2}`,borderRadius:12,padding:24,minWidth:320,boxShadow:"0 24px 64px rgba(0,0,0,0.5)" }}>
            <div className="mono" style={{ fontSize:13,color:C.cyan,marginBottom:16,letterSpacing:"0.1em" }}>KEYBOARD SHORTCUTS</div>
            {[["j / ↓","Next alert"],["k / ↑","Previous alert"],["Escape","Deselect alert"],["/ ","Focus search"],["?","Toggle this overlay"]].map(([k,v])=>(
              <div key={k} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10 }}>
                <span className="mono" style={{ fontSize:12,background:C.card,border:`1px solid ${C.border2}`,borderRadius:4,padding:"2px 8px",color:C.cyan }}>{k}</span>
                <span style={{ fontSize:12,color:C.secondary }}>{v}</span>
              </div>
            ))}
            <div style={{ marginTop:14,fontSize:11,color:C.muted,textAlign:"center" }}>Press ? or Escape to close</div>
          </div>
        </div>
        );
      };

      return (
        <div style={{ height:"100vh",overflow:"hidden",background:C.bg,color:C.text,display:"flex",flexDirection:"column",backgroundImage:"radial-gradient(ellipse at top left,rgba(0,180,255,0.04) 0%,transparent 50%),radial-gradient(ellipse at bottom right,rgba(167,139,250,0.03) 0%,transparent 50%)" }}>

          {showOnboard && <OnboardingModal onClose={closeOnboard}/>}
          {showPicker  && <AnalystPicker current={analyst} onSelect={handleLogin} onClose={()=>setShowPicker(false)}/>}
          {showAbout && <AboutModal onClose={()=>setShowAbout(false)}/>}
          {showKeys  && <ShortcutsModal/>}
          {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}

          {/* Header */}
          <header style={{ height:HEADER_H,borderBottom:`1px solid ${C.border}`,padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(8,13,20,0.9)",backdropFilter:"blur(8px)",flexShrink:0,zIndex:50,gap:12 }}>
            <div style={{ display:"flex",alignItems:"center",gap:12,flexShrink:0 }}>
              <h1 style={{ margin:0,fontSize:14,fontWeight:700,letterSpacing:"0.08em",color:C.cyan,whiteSpace:"nowrap",fontFamily:"IBM Plex Mono,monospace" }}>SENTINEL<span style={{ color:C.bright }}>IQ</span></h1>
              <span className="header-title-sub" style={{ fontSize:11,color:C.muted,whiteSpace:"nowrap" }}>SOC Platform v2.0</span>
              <span style={{ fontSize:11,fontFamily:"IBM Plex Mono",padding:"2px 8px",borderRadius:4,background:`${threatColor}18`,border:`1px solid ${threatColor}40`,color:threatColor,whiteSpace:"nowrap" }}>● {threatLevel}</span>
            </div>
            <div className="header-feeds" style={{ display:"flex",alignItems:"center",gap:12,overflow:"hidden",flexWrap:"nowrap" }}>
              {FEEDS.map(f=>(
                <div key={f.name} style={{ display:"flex",alignItems:"center",gap:5,flexShrink:0 }}>
                  <Dot live={f.live} tip={f.tip}/>
                  <span className="feed-label" style={{ fontSize:11,color:f.live?C.cyan:"#fbbf24",whiteSpace:"nowrap" }}>{f.name}</span>
                </div>
              ))}
              <div style={{ display:"flex",alignItems:"center",gap:5,flexShrink:0 }}>
                <Dot live={true} tip="AI Analyst active via Supabase"/>
                <span className="feed-label" style={{ fontSize:11,color:C.green }}>AI Analyst</span>
              </div>
              <div style={{ display:"flex",alignItems:"center",gap:5,flexShrink:0 }}>
                <Dot live={dbReady} tip={dbReady?"Alert persistence active":"Using local data"}/>
                <span className="feed-label" style={{ fontSize:11,color:dbReady?C.green:"#fbbf24" }}>Supabase</span>
              </div>
              <div style={{ display:"flex",alignItems:"center",gap:5,flexShrink:0 }}>
                <span style={{ width:8,height:8,borderRadius:"50%",background:rtStatus==="live"?"#4ade80":rtStatus==="error"?"#f87171":"#fbbf24",display:"inline-block",animation:rtStatus==="live"?"rt-pulse 2s infinite":"none" }}/>
                <span className="feed-label mono" style={{ fontSize:11,color:rtStatus==="live"?"#4ade80":rtStatus==="error"?"#f87171":"#fbbf24" }}>
                  {rtStatus==="live"?"Realtime":rtStatus==="error"?"RT Error":"RT Connecting"}
                </span>
              </div>
            </div>
            <div style={{ display:"flex",alignItems:"center",gap:10,flexShrink:0 }}>
              <span className="header-clock mono" style={{ fontSize:11,color:C.muted,whiteSpace:"nowrap" }}>{time.toUTCString().slice(0,-4)} UTC</span>
              <button type="button" onClick={()=>setShowKeys(true)} title="Keyboard shortcuts (?)" style={{ background:"none",border:`1px solid ${C.border}`,borderRadius:4,color:C.subtle,fontSize:11,padding:"2px 6px",cursor:"pointer",fontFamily:"IBM Plex Mono" }}>?</button>
              <AvatarMenu onAbout={()=>setShowAbout(true)} onSettings={()=>setSideTab("settings")} analyst={analyst} onLogout={handleLogout} onSwitchAnalyst={()=>setShowPicker(true)}/>
            </div>
          </header>

          {/* Main content */}
          <main id="main-content" style={{ flex:1,minHeight:0,display:"flex",overflow:"hidden" }}>

            {/* Sidebar */}
            <Sidebar active={sideTab} onChange={setSideTab}/>

            {/* Dashboard — command center */}
            {sideTab==="dashboard" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><DashboardOverview alerts={alerts} incidents={INCIDENTS_RAW} kevs={kevs} activity={activity} setSideTab={setSideTab}/></div></EB>}

            {/* Threat Hunt */}
            {sideTab==="hunt" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><ThreatHunt alerts={alerts}/></div></EB>}

            {/* Reports */}
            {sideTab==="reports" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><ReportsPanel/></div></EB>}

            {/* Settings */}
            {sideTab==="settings" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><SettingsPanel setSideTab={setSideTab}/></div></EB>}

            {/* Incident Management */}
            {sideTab==="incidents" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><IncidentDashboard/></div></EB>}

            {/* GRC Tracker */}
            {sideTab==="grc" && <EB><div style={{ flex:1,minHeight:0,overflow:"hidden",display:"flex",flexDirection:"column" }}><GRCDashboard/></div></EB>}

            {/* Alert Queue — full column layout with stats bar inside */}
            {sideTab === "alerts" && (
            <div style={{ flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden" }}>

              {/* Stats Bar — inside alerts column, above the 3 panels */}
              <div style={{ padding:"8px 16px",display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,borderBottom:`1px solid ${C.border}`,flexShrink:0,background:C.surface }}>
                {stats.map(s=>{
                  const sc = STAT_COLORS[s.label] || { c:C.bright, bg:C.card };
                  const isActive = (filter==="CRITICAL"&&s.label==="Critical")||(filter==="HIGH"&&s.label==="High")||(filter==="Open"&&s.label==="Open");
                  return (
                    <button key={s.label} type="button" onClick={()=>statFilter(s.label)} aria-label={`Filter by ${s.label}`}
                      style={{ background:isActive?sc.bg:C.card,border:`1px solid ${isActive?C.border2:C.border}`,borderRadius:8,padding:"8px 12px",cursor:s.filterKey?"pointer":"default",transition:"all 0.15s",textAlign:"left",outline:"none" }}>
                      <div className="mono" style={{ fontSize:20,fontWeight:700,color:sc.c,marginBottom:1 }}>{s.value}</div>
                      <div style={{ fontSize:10,color:C.secondary,textTransform:"uppercase",letterSpacing:"0.06em",fontFamily:"IBM Plex Mono" }}>{s.label}</div>
                      <div style={{ fontSize:10,color:C.muted,marginTop:1 }}>{s.sub}</div>
                    </button>
                  );
                })}
              </div>

              {/* 3-column layout */}
              <div style={{ flex:1,minHeight:0,display:"flex",overflow:"hidden" }}>

            {/* LEFT: Alert list */}
            <div style={{ width:280,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0 }}>

              {/* Column header */}
              <div style={{ padding:"10px 14px",borderBottom:`1px solid ${C.border}`,flexShrink:0,background:C.surface }}>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6 }}>
                  <h2 className="mono" style={{ fontSize:11,fontWeight:700,color:C.bright,textTransform:"uppercase",letterSpacing:"0.12em",margin:0 }}>Alert Queue</h2>
                  <div style={{ display:"flex",alignItems:"center",gap:6 }}>
                    <Dot live={true}/>
                    <span className="mono" style={{ fontSize:10,color:C.subtle }}>{filteredAlerts.length} shown</span>
                  </div>
                </div>
                <div style={{ display:"flex",gap:6,alignItems:"center" }}>
                  <div style={{ position:"relative",flex:1 }}>
                    <svg style={{ position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",pointerEvents:"none" }} width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke={C.muted} strokeWidth="2"/><path d="M21 21l-4.35-4.35" stroke={C.muted} strokeWidth="2" strokeLinecap="round"/></svg>
                    <label htmlFor="alert-search" style={{ position:"absolute",width:1,height:1,overflow:"hidden",clip:"rect(0,0,0,0)",whiteSpace:"nowrap" }}>Search alerts</label>
                    <input id="alert-search" ref={searchRef} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search alerts..."
                      aria-label="Search alerts"
                      style={{ width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:5,padding:"5px 8px 5px 26px",fontSize:12,color:C.bright,fontFamily:"DM Sans,sans-serif" }}/>
                  </div>
                  {search && <button type="button" onClick={()=>setSearch("")} style={{ background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:14,padding:"0 2px",lineHeight:1 }}>✕</button>}
                </div>
              </div>

              {/* Severity filter chips */}
              <div style={{ padding:"6px 10px",borderBottom:`1px solid ${C.border}`,display:"flex",gap:4,flexShrink:0,background:"rgba(255,255,255,0.01)" }}>
                {[{key:null,label:"All",count:alerts.length},{key:"CRITICAL",label:"Crit",count:alerts.filter(a=>a.severity==="CRITICAL").length},{key:"HIGH",label:"High",count:alerts.filter(a=>a.severity==="HIGH").length},{key:"Open",label:"Open",count:open}].map(f=>{
                  const isActive = filter===f.key || (f.key===null&&!filter);
                  const fColor = f.key==="CRITICAL"?"#f87171":f.key==="HIGH"?"#fb923c":f.key==="Open"?C.cyan:C.subtle;
                  return (
                    <button key={String(f.key)} type="button" onClick={()=>setFilter(f.key==="Open"?"Open":f.key)}
                      style={{ flex:1,padding:"3px 0",fontSize:10,fontFamily:"IBM Plex Mono",borderRadius:4,cursor:"pointer",border:`1px solid ${isActive?(fColor+"60"):C.border}`,background:isActive?`${fColor}15`:"none",color:isActive?fColor:C.muted,transition:"all 0.15s" }}>
                      {f.label} <span style={{ opacity:0.7 }}>{f.count}</span>
                    </button>
                  );
                })}
              </div>

              {/* Alert list */}
              <div style={{ flex:1,overflowY:"auto",padding:"6px 8px" }}>
                {filteredAlerts.length === 0
                  ? (
                    <div style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:120,gap:8,color:C.muted }}>
                      <svg width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" strokeWidth="1.5" d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
                      <span style={{ fontSize:12 }}>No alerts match</span>
                      {(search||filter) && <button type="button" onClick={()=>{setSearch("");setFilter(null);}} style={{ fontSize:11,color:C.cyan,background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Clear filters</button>}
                    </div>
                  )
                  : filteredAlerts.map(a=><AlertRow key={a.id} alert={a} onClick={setSel} selected={sel?.id===a.id} timeStr={timeAgo(a.offsetMs)}/>)
                }
              </div>

              {/* Active filter chip */}
              {filter && (
                <div style={{ padding:"5px 12px",borderTop:`1px solid ${C.border}`,fontSize:11,color:C.cyan,background:C.cyanDim,display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0 }}>
                  <span className="mono">Filtered: {filter}</span>
                  <button type="button" onClick={()=>setFilter(null)} style={{ background:"none",border:"none",color:C.cyan,cursor:"pointer",fontSize:11,fontFamily:"IBM Plex Mono" }}>✕ Clear</button>
                </div>
              )}

              {/* Footer hint */}
              <div style={{ padding:"5px 12px",borderTop:`1px solid ${C.border}`,flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center" }}>
                <span style={{ fontSize:10,color:C.muted }}>j/k to navigate</span>
                <button type="button" onClick={()=>setShowKeys(true)} style={{ fontSize:10,color:C.muted,background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono" }}>? shortcuts</button>
              </div>
            </div>

            {/* CENTER: Alert detail */}
            <div style={{ flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0 }}>

              {/* Tab strip */}
              <div style={{ borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,background:C.surface,paddingRight:12 }}>
                <div style={{ display:"flex" }}>
                  {[{key:"alerts",label:"Alert Detail",sub:"AI Analysis + SOAR"},{key:"cisa",label:"CISA KEV",sub:loaded?`${kevs.length} live CVEs`:"Loading..."}].map(t=>(
                    <button key={t.key} type="button" onClick={()=>setTab(t.key)}
                      style={{ padding:"10px 18px",fontSize:11,background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono",borderBottom:tab===t.key?`2px solid ${C.cyan}`:"2px solid transparent",color:tab===t.key?C.cyan:C.subtle,transition:"color 0.15s",textAlign:"left" }}>
                      <div style={{ textTransform:"uppercase",letterSpacing:"0.1em" }}>{t.label}</div>
                      <div style={{ fontSize:9,color:tab===t.key?C.subtle:C.muted,marginTop:1,letterSpacing:"0.05em" }}>{t.sub}</div>
                    </button>
                  ))}
                </div>
                {sel && tab==="alerts" && (
                  <div style={{ display:"flex",alignItems:"center",gap:6 }}>
                    <span className="mono" style={{ fontSize:10,color:C.muted }}>{sel.id}</span>
                    <span style={{ fontSize:10,color:C.muted }}>·</span>
                    <span className="mono" style={{ fontSize:10,color:SEV[sel.severity]?.text||C.subtle }}>{sel.severity}</span>
                  </div>
                )}
              </div>

              <div style={{ flex:1,overflowY:"auto",padding:16 }}>
                {tab==="alerts" && <AlertDetail alert={sel} alerts={alerts} onTriage={handleTriage} onCreateIncident={(a)=>{ setSideTab("incidents"); setToast(`Incident created from ${a.id}`); }} onSelectAlert={setSel}/>}
                {tab==="cisa" && (
                  <div>
                    <CISAFeed vulns={kevs} loaded={loaded} alerts={alerts}/>
                  </div>
                )}
              </div>
            </div>

            {/* RIGHT: Threat intel panel */}
            <div style={{ width:272,borderLeft:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0 }}>

              {/* Column header */}
              <div style={{ padding:"10px 14px",borderBottom:`1px solid ${C.border}`,flexShrink:0,background:C.surface }}>
                <h2 className="mono" style={{ fontSize:11,fontWeight:700,color:C.bright,textTransform:"uppercase",letterSpacing:"0.12em",margin:0 }}>Threat Intel</h2>
              </div>

              <div style={{ flex:1,overflowY:"auto" }}>

                {/* IOC Lookup */}
                <div style={{ padding:14,borderBottom:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:10 }}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke={C.cyan} strokeWidth="1.5"/><path d="M21 21l-4.35-4.35" stroke={C.cyan} strokeWidth="1.5" strokeLinecap="round"/></svg>
                    <span className="mono" style={{ fontSize:10,color:C.cyan,textTransform:"uppercase",letterSpacing:"0.1em" }}>IOC Lookup</span>
                    <span style={{ marginLeft:"auto",fontSize:9,color:C.muted,fontFamily:"IBM Plex Mono" }}>AbuseIPDB · VT</span>
                  </div>
                  <IOCLookup/>
                </div>

                {/* Activity Feed */}
                <div style={{ padding:14,borderBottom:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:10 }}>
                    <Dot live={true}/>
                    <span className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>Activity Feed</span>
                  </div>
                  {activity.map((a,i)=>{
                    const target = alerts.find(al=>al.id===a.id);
                    return (
                      <button key={i} type="button"
                        onClick={()=>{ if(target){ setSel(target); setSideTab("alerts"); } }}
                        style={{ width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:8,marginBottom:6,background:"none",border:"none",cursor:target?"pointer":"default",borderRadius:5,padding:"5px 6px",transition:"background 0.15s" }}
                        onMouseEnter={e=>{ if(target) e.currentTarget.style.background=C.card; }}
                        onMouseLeave={e=>{ e.currentTarget.style.background="none"; }}
                      >
                        <span className="mono" style={{ fontSize:10,color:C.cyan,flexShrink:0,width:54 }}>{a.id}</span>
                        <div style={{ flex:1,minWidth:0 }}>
                          <div style={{ fontSize:11,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{a.msg}</div>
                          <div className="mono" style={{ fontSize:10,color:C.subtle }}>{timeAgo(a.offsetMs)}</div>
                        </div>
                        {target && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" style={{ flexShrink:0,color:C.muted }}><path d="M9 18l6-6-6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </button>
                    );
                  })}
                </div>

                {/* MITRE ATT&CK */}
                <div style={{ padding:14,borderBottom:`1px solid ${C.border}` }}>
                  <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:10 }}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z" stroke={C.purple} strokeWidth="1.5"/></svg>
                    <span className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>MITRE ATT&CK</span>
                    <span style={{ marginLeft:"auto",fontSize:9,color:C.muted,fontFamily:"IBM Plex Mono" }}>Active tactics</span>
                  </div>
                  {MITRE.map(({tactic,count,color})=>(
                    <div key={tactic} style={{ marginBottom:8 }}>
                      <div style={{ display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3 }}>
                        <span style={{ color:C.secondary }}>{tactic}</span>
                        <span className="mono" style={{ color:C.subtle }}>{count}</span>
                      </div>
                      <div style={{ height:3,background:"rgba(255,255,255,0.05)",borderRadius:2,overflow:"hidden" }}>
                        <div style={{ height:"100%",background:color,borderRadius:2,width:`${(count/MITRE_MAX)*100}%`,transition:"width 0.5s ease" }}/>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Attribution */}
                <div style={{ padding:14 }}>
                  <div style={{ fontSize:11,color:C.muted,lineHeight:1.8 }}>
                    Portfolio project by <a href="https://mmohamud.me" target="_blank" style={{ color:C.cyan,textDecoration:"none" }}>Mohamed Mohamud</a>
                    <br/>React · Supabase · Claude API
                    <br/><a href="https://github.com/mmohamud25" target="_blank" style={{ color:C.subtle,textDecoration:"none" }}>GitHub</a>
                    {" · "}
                    <a href="https://linkedin.com/in/mohamed-2-mohamud" target="_blank" style={{ color:C.subtle,textDecoration:"none" }}>LinkedIn</a>
                  </div>
                </div>

              </div>
            </div>

            </div>{/* end 3-column layout */}
            </div>)}{/* end alerts tab */}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
