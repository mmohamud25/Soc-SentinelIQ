      constructor(props) { super(props); this.state = { hasError:false, error:null }; }

      reset() { this.setState({ hasError:false, error:null }); }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,padding:40,color:"#f87171" }}>

              <div style={{ fontSize:12,color:"#64748b",maxWidth:300,textAlign:"center" }}>{this.state.error?.message || "Unknown error"}</div>

                      <div style={{ display:"flex",gap:8 }}>
                        <input value={noteVal} onChange={e=>setNoteVal(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"&&noteVal.trim()){ addNote(selInc.id,noteVal); setNoteVal(""); }}}

                          style={{ flex:1,background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:5,padding:"6px 10px",fontSize:12,color:C.bright,fontFamily:"DM Sans,sans-serif" }}/>
                        <button type="button" onClick={()=>{ if(noteVal.trim()){ addNote(selInc.id,noteVal); setNoteVal(""); }}}
                          style={{ padding:"6px 14px",background:C.cyanDim,border:`1px solid rgba(34,211,238,0.3)`,borderRadius:5,color:C.cyan,fontSize:12,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>Add</button>
                      </div>
                    </div>

                    {/* AI Executive Summary */}
                    <div style={{ marginTop:14,borderTop:`1px solid ${C.border}`,paddingTop:14 }}>
                      <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10 }}>

                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill={C.purple}/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke={C.purple} strokeWidth="1.5" strokeLinecap="round"/></svg>
                          <span className="mono" style={{ fontSize:11,color:C.purple,textTransform:"uppercase",letterSpacing:"0.1em" }}>AI Executive Summary</span>

                        {(aiStatus==="idle"||aiStatus==="error") &&
                          <button type="button" onClick={runAI} style={{ padding:"5px 12px",borderRadius:5,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer",background:C.purpleDim,border:`1px solid rgba(167,139,250,0.4)`,color:C.purple,display:"flex",alignItems:"center",gap:5 }}>

                            Generate Report
                          </button>
                        }
                        {aiStatus==="done" && <button type="button" onClick={()=>{setAiStatus("idle");setAiOutput("");}} style={{ padding:"5px 12px",borderRadius:5,fontSize:11,background:"none",border:`1px solid ${C.border}`,color:C.subtle,cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Clear</button>}
                      </div>
                      {aiStatus==="idle" && <div style={{ borderRadius:7,border:`1px solid rgba(167,139,250,0.15)`,background:C.purpleDim,padding:11,fontSize:12,color:C.subtle }}>Generate a plain-language executive summary suitable for briefing leadership or filing a formal incident report.</div>}
                      {aiStatus==="loading" && (
                        <div style={{ borderRadius:7,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:12,display:"flex",flexDirection:"column",gap:8 }}>

                      {aiStatus==="done" && aiOutput && (
                        <div className="fade-in" style={{ display:"flex",flexDirection:"column",gap:8 }}>

                            <div style={{ display:"grid",gridTemplateColumns:"80px 1fr",gap:8 }}>
                              <div style={{ borderRadius:7,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:10,textAlign:"center" }}>
                                <div style={{ fontSize:9,color:C.subtle,marginBottom:4 }}>RISK</div>
                                <div className="mono" style={{ fontSize:13,fontWeight:700,color:({CRITICAL:"#f87171",HIGH:"#fb923c",MEDIUM:"#fbbf24",LOW:"#4ade80"})[aiOutput.risk_level]||C.purple }}>{aiOutput.risk_level||"—"}</div>
                              </div>
                              <div style={{ borderRadius:7,border:`1px solid ${C.border}`,background:C.surface,padding:10 }}>
                                <div style={{ fontSize:10,color:C.subtle,marginBottom:4 }}>STATUS</div>
                                <div style={{ fontSize:12,color:C.text,lineHeight:1.5 }}>{aiOutput.status_line}</div>
                              </div>
                            </div>
                            {aiOutput.impact && (
                              <div style={{ borderRadius:7,border:`1px solid rgba(239,68,68,0.2)`,background:"rgba(239,68,68,0.05)",padding:10 }}>
                                <div style={{ fontSize:10,color:"#f87171",marginBottom:4 }}>BUSINESS IMPACT</div>
                                <div style={{ fontSize:12,color:C.text,lineHeight:1.5 }}>{aiOutput.impact}</div>
                              </div>
                            )}
                            {Array.isArray(aiOutput.actions_taken) && aiOutput.actions_taken.length > 0 && (
                              <div style={{ borderRadius:7,border:`1px solid ${C.border}`,background:C.card,padding:10 }}>
                                <div style={{ fontSize:10,color:"#4ade80",marginBottom:6 }}>ACTIONS TAKEN</div>
                                {aiOutput.actions_taken.map((a,i)=>(
                                  <div key={i} style={{ display:"flex",gap:6,marginBottom:5,fontSize:11,color:C.text }}>
                                    <span style={{ color:"#4ade80",flexShrink:0 }}>✓</span>{a}
                                  </div>
                                ))}
                              </div>
                            )}
                            {Array.isArray(aiOutput.next_steps) && aiOutput.next_steps.length > 0 && (
                              <div style={{ borderRadius:7,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:10 }}>
                                <div style={{ fontSize:10,color:C.purple,marginBottom:6 }}>NEXT STEPS</div>
                                {aiOutput.next_steps.map((s,i)=>(
                                  <div key={i} style={{ display:"flex",gap:6,marginBottom:5,fontSize:11,color:C.text }}>
                                    <span className="mono" style={{ color:C.purple,flexShrink:0 }}>{i+1}.</span>{s}
                                  </div>
                                ))}
                              </div>
                            )}
                          </> : (
                            <div style={{ borderRadius:7,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:12,fontSize:12,color:C.text,lineHeight:1.75 }}>
                              {String(aiOutput).replace(/#{1,3}\s*/g,"").replace(/\*\*/g,"")}
                            </div>
                          )}
                        </div>
                      )}
                      {aiStatus==="error" && <div style={{ borderRadius:7,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:11,fontSize:12,color:"#f87171" }}>Error: {String(aiOutput)}</div>}
                    </div>

                  </div>
                </div>
              );
            })()}

            {/* Right: Status distribution + severity breakdown */}
            <div style={{ borderLeft:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden" }}>
              <div style={{ padding:"10px 14px",borderBottom:`1px solid ${C.border}` }}>
                <span className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>Metrics</span>
              </div>
              <div style={{ flex:1,overflowY:"auto",padding:14 }}>

                {/* MTTD/MTTR cards */}
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16 }}>
                  {[["MTTD",`${avgMTTD}m`,"Mean Time to Detect","#fbbf24"],["MTTR",`${avgMTTR}m`,"Mean Time to Respond",C.cyan]].map(([k,v,sub,c])=>(
                    <div key={k} style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:10,textAlign:"center" }}>
                      <div className="mono" style={{ fontSize:22,fontWeight:700,color:c }}>{v}</div>
                      <div className="mono" style={{ fontSize:10,color:C.subtle,marginTop:2 }}>{k}</div>
                      <div style={{ fontSize:10,color:C.muted,marginTop:2 }}>{sub}</div>
                    </div>
                  ))}
                </div>

                {/* Status distribution */}
                <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10 }}>By Status</div>
                {INC_STATUSES.map(s=>{
                  const count = incidents.filter(i=>i.status===s).length;
                  const sc2   = INC_STATUS_COLOR[s];
                  if (!count) return null;
                  return (
                    <div key={s} style={{ marginBottom:8 }}>
                      <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3 }}>
                        <span style={{ color:C.text }}>{s}</span>
                        <span className="mono" style={{ color:C.subtle }}>{count}</span>
                      </div>
                      <div style={{ height:5,background:"rgba(255,255,255,0.05)",borderRadius:3,overflow:"hidden" }}>
                        <div style={{ height:"100%",background:sc2.c,borderRadius:3,width:`${(count/incidents.length)*100}%`,opacity:0.8,transition:"width 0.5s ease" }}/>
                      </div>
                    </div>
                  );
                })}

                {/* Severity breakdown */}
                <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10,marginTop:16 }}>By Severity</div>
                {["CRITICAL","HIGH","MEDIUM","LOW"].map(sev=>{
                  const count = incidents.filter(i=>i.severity===sev).length;
                  if (!count) return null;
                  const sc2 = SEV[sev];
                  return (
                    <div key={sev} style={{ marginBottom:8 }}>
                      <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3 }}>
                        <span style={{ color:sc2.text }}>{sev}</span>
                        <span className="mono" style={{ color:C.subtle }}>{count}</span>
                      </div>
                      <div style={{ height:5,background:"rgba(255,255,255,0.05)",borderRadius:3,overflow:"hidden" }}>
                        <div style={{ height:"100%",background:sc2.dot,borderRadius:3,width:`${(count/incidents.length)*100}%`,opacity:0.8,transition:"width 0.5s ease" }}/>
                      </div>
                    </div>
                  );
                })}

                {/* Recent closed */}
                <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10,marginTop:16 }}>Recently Closed</div>
                {incidents.filter(i=>i.status==="Closed").map(i=>(
                  <button key={i.id} type="button" onClick={()=>setSelInc(i)}
                    style={{ width:"100%",textAlign:"left",padding:"7px 8px",borderRadius:5,marginBottom:4,background:"none",border:`1px solid ${C.border}`,cursor:"pointer",transition:"background 0.15s" }}
                    onMouseEnter={e=>e.currentTarget.style.background=C.card}
                    onMouseLeave={e=>e.currentTarget.style.background="none"}>
                    <div className="mono" style={{ fontSize:10,color:C.green,marginBottom:2 }}>{i.id} ✓</div>
                    <div style={{ fontSize:11,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }} title={i.title}>{i.title}</div>
                  </button>
                ))}

              </div>
            </div>

          </div>
        </div>
      );
    }

    // ── Dashboard Overview ────────────────────────────────────────────────────
    function DashboardOverview({ alerts, incidents, kevs, activity, setSideTab }) {
      const critical  = alerts.filter(a=>a.severity==="CRITICAL"&&a.status!=="Closed").length;
      const high      = alerts.filter(a=>a.severity==="HIGH"&&a.status!=="Closed").length;
      const open      = alerts.filter(a=>a.status==="Open").length;
      const openInc   = incidents.filter(i=>i.status!=="Closed").length;
      const grcScore  = Math.round((CONTROLS_RAW.filter(c=>c.status==="Implemented").length/CONTROLS_RAW.length)*100);
      const avgMTTD   = Math.round(incidents.reduce((s,i)=>s+(i.detectedMs/60000),0)/incidents.length);
      const threat    = critical>0?"CRITICAL":high>=2?"HIGH":high===1?"MEDIUM":"LOW";
      const tColor    = {CRITICAL:"#dc2626",HIGH:"#f97316",MEDIUM:"#fbbf24",LOW:"#4ade80"}[threat];

      // 24h alert volume — simulated hourly distribution
      const hours = Array.from({length:24},(_,i)=>{
        const h = (new Date().getHours()-23+i+24)%24;
        const base = [1,0,0,1,0,0,0,1,2,3,4,2,3,2,1,2,3,4,3,2,2,3,2,1][i];
        return { h:`${h}:00`, v:base };
      });
      const maxV = Math.max(...hours.map(h=>h.v),1);

      const MITRE_ACTIVE = ["Command & Control","Lateral Movement","Execution","Credential Access","Exfiltration"];

      return (
        <div style={{ flex:1,overflowY:"auto",padding:20,display:"flex",flexDirection:"column",gap:16 }}>

          {/* Threat level + quick stats */}
          <div style={{ display:"grid",gridTemplateColumns:"200px 1fr",gap:16 }}>
            {/* Threat gauge */}
            <div style={{ background:C.card,border:`1px solid ${tColor}40`,borderRadius:12,padding:20,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8 }}>
              <div style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>Threat Level</div>
              <div style={{ position:"relative",width:100,height:100 }}>
                <svg width="100" height="100" viewBox="0 0 100 100">
                  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="8"/>
                  <circle cx="50" cy="50" r="42" fill="none" stroke={tColor} strokeWidth="8"
                    strokeDasharray={`${2*Math.PI*42}`}
                    strokeDashoffset={`${2*Math.PI*42*(1-{CRITICAL:1,HIGH:0.75,MEDIUM:0.5,LOW:0.25}[threat])}`}
                    strokeLinecap="round" transform="rotate(-90 50 50)"/>
                </svg>
                <div style={{ position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center" }}>
                  <span className="mono" style={{ fontSize:11,fontWeight:700,color:tColor,textAlign:"center",lineHeight:1.2 }}>{threat}</span>
                </div>
              </div>
              <div style={{ fontSize:12,color:C.subtle,textAlign:"center" }}>
                {critical>0?`${critical} critical unresolved`:`${high} high severity active`}
              </div>
            </div>
            {/* Quick stats */}
            <div style={{ display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8 }}>
              {[
                { label:"Open Alerts",    value:open,       color:"#f87171",  icon:"🔔", tab:"alerts"    },
                { label:"Open Incidents", value:openInc,    color:"#fb923c",  icon:"📋", tab:"incidents" },
                { label:"GRC Compliance", value:`${grcScore}%`,color:grcScore>=80?"#4ade80":grcScore>=60?"#fbbf24":"#f87171", icon:"🛡", tab:"grc" },
                { label:"Avg MTTD",       value:`${avgMTTD}m`, color:C.cyan,  icon:"⏱", tab:"alerts"    },
              ].map(s=>(
                <button key={s.label} type="button" onClick={()=>setSideTab(s.tab)}
                  style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"14px 16px",textAlign:"left",cursor:"pointer",transition:"border 0.15s" }}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=s.color}
                  onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <div style={{ fontSize:22,marginBottom:6 }}>{s.icon}</div>
                  <div className="mono" style={{ fontSize:22,fontWeight:700,color:s.color }}>{s.value}</div>
                  <div style={{ fontSize:12,color:C.subtle,marginTop:2 }}>{s.label}</div>
                </button>
              ))}
            </div>
          </div>

          {/* Alert volume 24h chart */}
          <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16 }}>
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12 }}>
              <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>Alert Volume — Last 24h</div>
              <span className="mono" style={{ fontSize:11,color:C.subtle }}>{alerts.length} total</span>
            </div>
            <div style={{ display:"flex",alignItems:"flex-end",gap:3,height:60 }}>
              {hours.map((h,i)=>(
                <div key={i} className="tip-wrap" style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2 }}>
                  <div style={{ width:"100%",borderRadius:"2px 2px 0 0",background:h.v>0?C.cyan:"rgba(255,255,255,0.05)",height:`${Math.max((h.v/maxV)*52,h.v>0?4:2)}px`,transition:"height 0.3s ease",opacity:h.v>0?0.8:0.3 }}/>
                  <span className="tip" style={{ bottom:"calc(100% + 4px)" }}>{h.h}: {h.v} alerts</span>
                </div>
              ))}
            </div>
            <div style={{ display:"flex",justifyContent:"space-between",marginTop:4 }}>
              <span style={{ fontSize:10,color:C.muted }}>24h ago</span>
              <span style={{ fontSize:10,color:C.muted }}>Now</span>
            </div>
          </div>

          {/* Alert Distribution + Open Incidents */}
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:16 }}>
            <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16 }}>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
                <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>Alert Distribution</div>
                <button type="button" onClick={()=>setSideTab("alerts")} style={{ fontSize:11,color:C.cyan,background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Triage →</button>
              </div>
              {["CRITICAL","HIGH","MEDIUM","LOW"].map(sev=>{
                const s = SEV[sev];
                const count = alerts.filter(a=>a.severity===sev).length;
                const openCount = alerts.filter(a=>a.severity===sev&&a.status==="Open").length;
                return (
                  <div key={sev} style={{ marginBottom:12 }}>
                    <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4 }}>
                      <div style={{ display:"flex",alignItems:"center",gap:6 }}>
                        <span style={{ width:8,height:8,borderRadius:2,background:s.dot,display:"inline-block" }}/>
                        <span style={{ color:s.text }}>{sev}</span>
                      </div>
                      <span className="mono" style={{ color:C.subtle }}>{openCount} open / {count} total</span>
                    </div>
                    <div style={{ height:6,background:"rgba(255,255,255,0.05)",borderRadius:3,overflow:"hidden" }}>
                      <div style={{ height:"100%",background:s.dot,borderRadius:3,width:`${(count/alerts.length)*100}%`,opacity:0.85 }}/>
                    </div>
                  </div>
                );
              })}
              <div style={{ marginTop:8,fontSize:11,color:C.subtle,display:"flex",justifyContent:"space-between" }}>
                <span>{open} unresolved</span>
                <span className="mono" style={{ color:tColor }}>● {threat}</span>
              </div>
            </div>
            <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16 }}>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10 }}>
                <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em" }}>Open Incidents</div>
                <button type="button" onClick={()=>setSideTab("incidents")} style={{ fontSize:11,color:C.cyan,background:"none",border:"none",cursor:"pointer",fontFamily:"IBM Plex Mono" }}>View all →</button>
              </div>
              {incidents.filter(i=>i.status!=="Closed").slice(0,4).map(inc=>{
                const ss=INC_STATUS_COLOR[inc.status]||INC_STATUS_COLOR.New;
                return (
                  <div key={inc.id} style={{ display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:`1px solid ${C.border}` }}>
                    <span className="mono" style={{ fontSize:10,color:C.subtle,flexShrink:0 }}>{inc.id}</span>
                    <span style={{ fontSize:12,color:C.text,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{inc.title}</span>
                    <span className="mono" style={{ fontSize:10,color:ss.c,flexShrink:0 }}>{inc.status}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* MITRE active + Latest KEVs */}
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:16 }}>
            <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16 }}>
              <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10 }}>Active MITRE Tactics</div>
              {MITRE_ACTIVE.map((t,i)=>{
                const m = MITRE.find(m=>m.tactic===t);
                return (
                  <div key={t} style={{ display:"flex",alignItems:"center",gap:8,marginBottom:6 }}>

    // ── Report: Weekly Summary ────────────────────────────────────────────────
    function ReportWeekly() {
      const [aiStatus, setAiStatus]  = useState("idle");
      const [parsed,   setParsed]    = useState(null);
      const [errMsg,   setErrMsg]    = useState("");
      const [genTime,  setGenTime]   = useState(null);
      const [copied,   setCopied]    = useState(false);
      const grcScore = Math.round((CONTROLS_RAW.filter(c=>c.status==="Implemented").length/CONTROLS_RAW.length)*100);
      const closed   = INCIDENTS_RAW.filter(i=>i.status==="Closed");

      useEffect(()=>{ if (aiStatus==="idle" && !parsed) generateSummary(); },[]);

      const generateSummary = async () => {
        setAiStatus("loading"); setParsed(null); setErrMsg("");
        const timeout = setTimeout(()=>{ setErrMsg("Request timed out — try again."); setAiStatus("error"); }, 12000);
        try {
          const payload = { weeklySummary: { alerts:ALERTS_RAW.length, critical:ALERTS_RAW.filter(a=>a.severity==="CRITICAL").length, incidents:INCIDENTS_RAW.length, closedIncidents:closed.length, grcScore, topTactics:MITRE.slice(0,3).map(m=>m.tactic), topThreats:INCIDENTS_RAW.slice(0,3).map(i=>i.title) }};
          const res  = await fetch(SUPABASE_URL,{method:"POST",headers:sbHeaders(),body:JSON.stringify(payload)});
          const data = await res.json();
          if (!res.ok||data.error) throw new Error(data.error||"Error");
          let result = null;
          try { const raw=data.summary||""; const s=raw.indexOf("{"),e=raw.lastIndexOf("}"); if(s>=0&&e>s) result=JSON.parse(raw.slice(s,e+1)); } catch {}
          if (!result) result = { threatLevel:"—", summary:data.summary||"", topThreats:[], grcStatus:`${grcScore}%`, recommendedActions:[], weeklyTrend:"See summary" };
          setParsed(result); setGenTime(new Date()); setAiStatus("done");
        } catch(e) { clearTimeout(timeout); setErrMsg(e.message); setAiStatus("error"); return; }
        clearTimeout(timeout);
      };

      const copyToClipboard = () => {
        if (!parsed) return;
        const text = [`SentinelIQ Weekly — ${new Date().toUTCString()}`,`Threat Level: ${parsed.threatLevel}`,`Summary: ${parsed.summary}`,`Top Threats: ${parsed.topThreats?.join(", ")}`,`GRC: ${parsed.grcStatus}`,`Trend: ${parsed.weeklyTrend}`,`Actions:\n${parsed.recommendedActions?.map((a,i)=>`${i+1}. ${a}`).join("\n")}`].join("\n\n");
        navigator.clipboard.writeText(text).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); });
      };

      const tColor = { CRITICAL:"#dc2626",HIGH:"#f97316",MEDIUM:"#fbbf24",LOW:"#4ade80",ELEVATED:"#f97316" };

      return (
        <div style={{ height:"100%",overflowY:"auto",padding:20 }}>
          {/* Header row */}
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8 }}>
            <div style={{ display:"flex",alignItems:"center",gap:8 }}>

    // ── Report: Shift Handover ────────────────────────────────────────────────
    function ReportHandover() {
      const [hoStatus,  setHoStatus]  = useState("idle");
      const [hoReport,  setHoReport]  = useState(null);
      const [hoErr,     setHoErr]     = useState("");
      const [hoCopied,  setHoCopied]  = useState(false);
      const grcScore = Math.round((CONTROLS_RAW.filter(c=>c.status==="Implemented").length/CONTROLS_RAW.length)*100);

      const generate = async () => {
        setHoStatus("loading"); setHoReport(null); setHoErr("");
        const timeout = setTimeout(()=>{ setHoErr("Request timed out — try again."); setHoStatus("error"); }, 12000);
        try {
          const payload = { handoverReport: { totalAlerts:ALERTS_RAW.length, openAlerts:ALERTS_RAW.filter(a=>a.status==="Open").length, critical:ALERTS_RAW.filter(a=>a.severity==="CRITICAL"&&a.status!=="Closed").length, investigating:ALERTS_RAW.filter(a=>a.status==="Investigating").length, closedAlerts:ALERTS_RAW.filter(a=>a.status==="Closed").length, openIncidents:INCIDENTS_RAW.filter(i=>i.status!=="Closed").length, closedIncidents:INCIDENTS_RAW.filter(i=>i.status==="Closed").length, grcScore, topAlerts:ALERTS_RAW.filter(a=>a.status!=="Closed").slice(0,3).map(a=>({id:a.id,title:a.title,severity:a.severity,status:a.status})), openIncidentList:INCIDENTS_RAW.filter(i=>i.status!=="Closed").slice(0,3).map(i=>({id:i.id,title:i.title,status:i.status,tactic:i.tactic})), shiftTime:new Date().toUTCString() }};
          const res  = await fetch(SUPABASE_URL,{method:"POST",headers:sbHeaders(),body:JSON.stringify(payload)});
          const data = await res.json();
          if (!res.ok||data.error) throw new Error(data.error||"Error");
          let parsed = null;
          try { const raw=data.report||""; const s=raw.indexOf("{"),e=raw.lastIndexOf("}"); if(s>=0&&e>s) parsed=JSON.parse(raw.slice(s,e+1)); } catch {}
          setHoReport(parsed||data.report); setHoStatus("done");
        } catch(e) { clearTimeout(timeout); setHoErr(e.message); setHoStatus("error"); return; }
        clearTimeout(timeout);
      };

      const copy = () => {
        if (!hoReport) return;
        const text = typeof hoReport==="object" ? [`SHIFT HANDOVER — ${new Date().toUTCString()}`,`Level: ${hoReport.threat_level}`,`Summary: ${hoReport.summary}`,`Watch:\n${hoReport.watch_items?.map((w,i)=>`${i+1}. ${w}`).join("\n")}`,`Actions:\n${hoReport.recommended_actions?.map((a,i)=>`${i+1}. ${a}`).join("\n")}`].join("\n\n") : String(hoReport);
        navigator.clipboard.writeText(text).then(()=>{ setHoCopied(true); setTimeout(()=>setHoCopied(false),2000); });
      };

      return (
        <div style={{ height:"100%",overflowY:"auto",padding:20 }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8 }}>
            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke={C.cyan} strokeWidth="1.5" strokeLinecap="round"/><circle cx="9" cy="7" r="4" stroke={C.cyan} strokeWidth="1.5"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke={C.cyan} strokeWidth="1.5" strokeLinecap="round"/></svg>
              <span className="mono" style={{ fontSize:12,color:C.cyan,textTransform:"uppercase",letterSpacing:"0.1em" }}>Shift Handover Report</span>
              {hoStatus==="loading" && <Spinner/>}
            </div>
            <div style={{ display:"flex",gap:6 }}>
              {hoStatus==="done" && <>
                <button type="button" onClick={copy} style={{ padding:"5px 12px",background:hoCopied?C.greenDim:C.cyanDim,border:`1px solid ${hoCopied?"rgba(74,222,128,0.3)":"rgba(34,211,238,0.3)"}`,borderRadius:5,color:hoCopied?C.green:C.cyan,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>{hoCopied?"✓ Copied":"Copy"}</button>
                <button type="button" onClick={()=>window.print()} style={{ padding:"5px 12px",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,borderRadius:5,color:C.subtle,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>Print</button>
                <button type="button" onClick={()=>{setHoStatus("idle");setHoReport(null);}} style={{ padding:"5px 12px",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,borderRadius:5,color:C.subtle,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>Clear</button>
              </>}
              {(hoStatus==="idle"||hoStatus==="error") && <button type="button" onClick={generate} style={{ padding:"5px 12px",background:C.cyanDim,border:"1px solid rgba(34,211,238,0.4)",borderRadius:5,color:C.cyan,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer",display:"flex",alignItems:"center",gap:5 }}><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>Generate</button>}
            </div>
          </div>

          {hoStatus==="idle" && <div style={{ borderRadius:8,border:`1px solid ${C.cyanDim}`,background:C.cyanDim,padding:14,fontSize:12,color:C.subtle }}>Generate a handover brief for the incoming shift — what fired, what was triaged, open items, and recommended watch points.</div>}
          {hoStatus==="loading" && (
            <div style={{ borderRadius:8,border:"1px solid rgba(34,211,238,0.2)",background:C.cyanDim,padding:14,display:"flex",flexDirection:"column",gap:8 }}>
              {["Reviewing alert queue...","Checking open incidents...","Assessing threat posture...","Writing handover brief..."].map((s,i)=>(
                <div key={i} className="pulse mono" style={{ display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.subtle,animationDelay:`${i*0.3}s` }}>
                  <span style={{ width:5,height:5,borderRadius:"50%",background:C.cyan,display:"inline-block" }}/>{s}
                </div>
              ))}
            </div>
          )}
          {hoStatus==="error" && <div style={{ borderRadius:8,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:11,fontSize:12,color:"#f87171" }}>{hoErr}</div>}
          {hoStatus==="done" && hoReport && (
            <div className="fade-in" style={{ display:"flex",flexDirection:"column",gap:10 }}>
              {typeof hoReport==="object" ? <>
                <div style={{ display:"grid",gridTemplateColumns:"90px 1fr",gap:10 }}>
                  <div style={{ borderRadius:8,border:"1px solid rgba(34,211,238,0.2)",background:C.cyanDim,padding:12,textAlign:"center" }}>
                    <div style={{ fontSize:9,color:C.subtle,marginBottom:4 }}>THREAT LEVEL</div>
                    <div className="mono" style={{ fontSize:13,fontWeight:700,color:({CRITICAL:"#f87171",HIGH:"#fb923c",MEDIUM:"#fbbf24",LOW:"#4ade80",ELEVATED:"#fb923c"})[hoReport.threat_level]||C.cyan }}>{hoReport.threat_level||"—"}</div>
                  </div>
                  <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,padding:12 }}>
                    <div style={{ fontSize:10,color:C.subtle,marginBottom:4 }}>SHIFT SUMMARY</div>
                    <div style={{ fontSize:12,color:C.text,lineHeight:1.6 }}>{hoReport.summary}</div>
                  </div>
                </div>
                {Array.isArray(hoReport.watch_items)&&hoReport.watch_items.length>0 && (
                  <div style={{ borderRadius:8,border:"1px solid rgba(251,146,60,0.25)",background:"rgba(251,146,60,0.06)",padding:12 }}>
                    <div style={{ fontSize:10,color:"#fb923c",marginBottom:8 }}>👁 WATCH ITEMS FOR INCOMING SHIFT</div>
                    {hoReport.watch_items.map((w,i)=><div key={i} style={{ display:"flex",gap:6,marginBottom:6,fontSize:12,color:C.text }}><span className="mono" style={{ color:"#fb923c",flexShrink:0 }}>{i+1}.</span>{w}</div>)}
                  </div>
                )}
                {Array.isArray(hoReport.recommended_actions)&&hoReport.recommended_actions.length>0 && (
                  <div style={{ borderRadius:8,border:"1px solid rgba(167,139,250,0.2)",background:C.purpleDim,padding:12 }}>
                    <div style={{ fontSize:10,color:C.purple,marginBottom:8 }}>✅ RECOMMENDED ACTIONS</div>
                    {hoReport.recommended_actions.map((a,i)=><div key={i} style={{ display:"flex",gap:6,marginBottom:6,fontSize:12,color:C.text }}><span className="mono" style={{ color:C.purple,flexShrink:0 }}>{i+1}.</span>{a}</div>)}
                  </div>
                )}
                {hoReport.stats && <div style={{ display:"flex",gap:6,flexWrap:"wrap" }}>{Object.entries(hoReport.stats).map(([k,v])=><div key={k} style={{ padding:"5px 10px",borderRadius:5,background:C.card,border:`1px solid ${C.border}`,fontSize:11 }}><span style={{ color:C.subtle }}>{k}: </span><span className="mono" style={{ color:C.text }}>{v}</span></div>)}</div>}
              </> : (
                <div style={{ fontSize:12,color:C.text,lineHeight:1.75,borderRadius:8,border:"1px solid rgba(34,211,238,0.2)",background:C.cyanDim,padding:12 }}>{String(hoReport).replace(/#{1,3}\s*/g,"").replace(/\*\*/g,"")}</div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── Report: GRC ───────────────────────────────────────────────────────────
    function ReportGRC() {
      const grcScore = Math.round((CONTROLS_RAW.filter(c=>c.status==="Implemented").length/CONTROLS_RAW.length)*100);
      const scoreColor = grcScore>=80?C.green:grcScore>=60?"#fbbf24":"#f87171";
      return (
        <div style={{ height:"100%",overflowY:"auto",padding:20 }}>
          <div style={{ display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16 }}>
            {[["Compliance Score",`${grcScore}%`,scoreColor],["Implemented",CONTROLS_RAW.filter(c=>c.status==="Implemented").length,C.green],["Gaps",CONTROLS_RAW.filter(c=>c.status==="Not Started").length,"#f87171"]].map(([k,v,c])=>(
              <div key={k} style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16,textAlign:"center" }}>
                <div className="mono" style={{ fontSize:24,fontWeight:700,color:c,marginBottom:4 }}>{v}</div>
                <div style={{ fontSize:12,color:C.subtle }}>{k}</div>
              </div>
            ))}
          </div>
          {/* Per-function breakdown */}
          <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16,marginBottom:14 }}>
            <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:14 }}>NIST CSF 2.0 Functions</div>
            {NIST_FUNCTIONS.map(fn=>{
              const fnControls = CONTROLS_RAW.filter(c=>c.fn===fn.id);
              const impl = fnControls.filter(c=>c.status==="Implemented").length;
              const pct  = fnControls.length ? Math.round((impl/fnControls.length)*100) : 0;
              return (
                <div key={fn.id} style={{ marginBottom:12 }}>
                  <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4 }}>
                    <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                      <span className="mono" style={{ fontSize:10,color:fn.color,padding:"1px 5px",borderRadius:3,background:`${fn.color}18`,border:`1px solid ${fn.color}40` }}>{fn.id}</span>
                      <span style={{ color:C.text }}>{fn.name}</span>
                    </div>
                    <span className="mono" style={{ color:C.subtle }}>{impl}/{fnControls.length}</span>
                  </div>
                  <div style={{ height:5,background:"rgba(255,255,255,0.05)",borderRadius:3,overflow:"hidden" }}>
                    <div style={{ height:"100%",background:fn.color,borderRadius:3,width:`${pct}%`,opacity:0.8,transition:"width 0.5s" }}/>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ display:"flex",gap:8 }}>
            <button type="button" onClick={()=>window.print()} style={{ padding:"7px 16px",background:C.cyanDim,border:"1px solid rgba(34,211,238,0.3)",borderRadius:6,color:C.cyan,fontSize:12,fontFamily:"IBM Plex Mono",cursor:"pointer" }}>Export PDF</button>
            <button type="button" title="CSV export coming in v3.0 — backend persistence required" style={{ padding:"7px 16px",background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:6,color:C.muted,fontSize:12,fontFamily:"IBM Plex Mono",cursor:"not-allowed",opacity:0.5 }}>Export CSV</button>
          </div>
        </div>
      );
    }

    // ── Settings ──────────────────────────────────────────────────────────────
    function SettingsPanel({ setSideTab }) {
      const [settingsTab, setSettingsTab] = useState("integrations");

      // ── Shared Toggle ────────────────────────────────────────────────────────

    function SettingsIntegrations({ Toggle }) {
      const [statuses, setStatuses] = useState({
        cisa:  { live:true,  label:"Live",     note:"Public API · No key required",        synced:"on load" },
        otx:   { live:true,  label:"Live",     note:"Real-time threat pulses active",       synced:"2m ago"  },
        abuse: { live:true,  label:"Live",     note:"IP reputation data active",            synced:"on demand"},
        vt:    { live:true,  label:"Live",     note:"Malware + IP analysis active",         synced:"on demand"},
        ai:    { live:true,  label:"Live",     note:"Anthropic Claude via Supabase",        synced:"on demand"},
      });
      const [testing,   setTesting]   = useState({});
      const [testResult,setTestResult]= useState({});
      const [keys,      setKeys]      = useState({ otx:"", abuse:"", vt:"" });
      const [showKey,   setShowKey]   = useState({});

      const testConn = async (id) => {
        setTesting(p=>({...p,[id]:true}));
        setTestResult(p=>({...p,[id]:null}));
        const t0 = Date.now();
        try {
          let url = `${SUPABASE_URL}?action=cisa`;
          let opts = { headers:sbHeaders() };
          if (id==="otx")   url = `${SUPABASE_URL}?action=otx`;
          if (id==="abuse"||id==="vt") url = `${SUPABASE_URL}?action=ioc&indicator=1.1.1.1`;
          if (id==="ai")    { url=SUPABASE_URL; opts={ method:"POST",headers:sbHeaders(),body:JSON.stringify({alert:{id:"TEST",severity:"LOW",title:"Connection test",source:"Settings",asset:"—",ip:"—",tactic:"—",status:"Open",description:"Settings test."}})}; }
          const res = await fetch(url, opts);
          const ms  = Date.now()-t0;
          setTestResult(p=>({...p,[id]:{ ok:res.ok, ms }}));
          setStatuses(p=>({...p,[id]:{...p[id],live:res.ok,label:res.ok?"Live":"Error"}}));
        } catch(e) {
          setTestResult(p=>({...p,[id]:{ ok:false, ms:Date.now()-t0 }}));
        }
        setTesting(p=>({...p,[id]:false}));
      };

      const INTEGRATIONS = [
        { id:"cisa",  name:"CISA KEV",          icon:"🛡", desc:"Known Exploited Vulnerabilities — updated daily", canKey:false },

          <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
            {INTEGRATIONS.map(integ=>{
              const st = statuses[integ.id];
              const sc = st.live ? C.green : "#f87171";
              const tr = testResult[integ.id];
              const isTesting = testing[integ.id];
              return (
                <div key={integ.id} style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16 }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10 }}>

                      <span style={{ fontSize:20 }}>{integ.icon}</span>
                      <div>
                        <div style={{ fontSize:13,fontWeight:600,color:C.bright }}>{integ.name}</div>
                        <div style={{ fontSize:11,color:C.subtle,marginTop:1 }}>{integ.desc}</div>
                      </div>
                    </div>
                    <div style={{ display:"flex",alignItems:"center",gap:8,flexShrink:0,marginLeft:12 }}>
                      <span style={{ width:7,height:7,borderRadius:"50%",background:sc,display:"inline-block",flexShrink:0 }}/>
                      <span className="mono" style={{ fontSize:11,color:sc }}>{st.label}</span>
                    </div>
                  </div>

                  {/* API key input for configurable sources */}
                  {integ.canKey && (
                    <div style={{ marginBottom:10 }}>
                      <label htmlFor={`key-${integ.id}`} style={{ fontSize:11,color:C.subtle,display:"block",marginBottom:4 }}>API Key</label>
                      <div style={{ display:"flex",gap:6 }}>
                        <input id={`key-${integ.id}`} type={showKey[integ.id]?"text":"password"} value={keys[integ.id]} onChange={e=>setKeys(p=>({...p,[integ.id]:e.target.value}))}
                          placeholder="Stored in Supabase secrets · Enter to update"
                          style={{ flex:1,background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:6,padding:"6px 10px",fontSize:12,color:C.bright,fontFamily:"IBM Plex Mono" }}/>
                        <button type="button" onClick={()=>setShowKey(p=>({...p,[integ.id]:!p[integ.id]}))}
                          style={{ padding:"6px 10px",background:"none",border:`1px solid ${C.border}`,borderRadius:6,color:C.subtle,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer",flexShrink:0 }}>

                {/* Score gauge */}
                <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16,marginBottom:14,textAlign:"center" }}>
                  <div style={{ position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center",width:100,height:100,marginBottom:8 }}>
                    <svg width="100" height="100" viewBox="0 0 100 100">
                      <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="8"/>
                      <circle cx="50" cy="50" r="42" fill="none" stroke={scoreColor} strokeWidth="8"
                        strokeDasharray={`${2*Math.PI*42}`}

                    </svg>
                    <div style={{ position:"absolute",textAlign:"center" }}>
                      <div className="mono" style={{ fontSize:22,fontWeight:700,color:scoreColor }}>{score}%</div>
                    </div>
                  </div>
                  <div style={{ fontSize:12,color:C.secondary }}>NIST CSF 2.0 Compliance</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:2 }}>{implemented} of {controls.length} controls</div>
                </div>

                {/* Per-function breakdown */}
                <div className="mono" style={{ fontSize:11,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10 }}>By Function</div>
                {NIST_FUNCTIONS.map(fn=>{
                  const fnCtrls = controls.filter(c=>c.fn===fn.id);
                  const fnImpl  = fnCtrls.filter(c=>c.status==="Implemented").length;

                  {[["NIST CSF 2.0","Active",C.cyan],["ISO 27001","Phase 4",C.muted],["SOC 2 Type II","Phase 4",C.muted]].map(([f,s,c])=>(

              </div>
            </div>

          </div>
        </div>

    // ── AI Analyst ────────────────────────────────────────────────────────────
    function AIAnalyst({ alert }) {
      const [status, setStatus] = useState("idle");
      const [parsed, setParsed] = useState(null);
      const [errMsg, setErrMsg] = useState("");
      useEffect(()=>{ setStatus("idle"); setParsed(null); setErrMsg(""); },[alert?.id]);

      const run = async () => {
        setStatus("loading"); setParsed(null); setErrMsg("");
        try {
          const res = await fetch(SUPABASE_URL, { method:"POST", headers:sbHeaders(), body:JSON.stringify({ alert }) });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || "Edge function error");
          setParsed(data.analysis);
          setStatus("done");
        } catch(e) { setErrMsg(e.message); setStatus("error"); }

      const vc = VCOLOR[parsed?.verdict] || VCOLOR.BENIGN;

        <div style={{ marginTop:16,borderTop:`1px solid ${C.border}`,paddingTop:16 }}>

            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill={C.purple}/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.636 5.636l2.121 2.121M16.243 16.243l2.121 2.121M5.636 18.364l2.121-2.121M16.243 7.757l2.121-2.121" stroke={C.purple} strokeWidth="1.5" strokeLinecap="round"/></svg>
              <span className="mono" style={{ fontSize:11,color:C.purple,textTransform:"uppercase",letterSpacing:"0.1em" }}>AI Analyst</span>
              {status==="loading" && <><Spinner/><span className="pulse" style={{ fontSize:11,color:C.subtle,marginLeft:4 }}>Analyzing...</span></>}
              {status==="done"    && <span className="mono" style={{ fontSize:11,padding:"2px 8px",borderRadius:4,background:C.greenDim,border:`1px solid rgba(74,222,128,0.3)`,color:C.green }}>Complete</span>}
            </div>
            {(status==="idle"||status==="error") &&
              <button type="button" onClick={run} aria-label="Run AI Analysis on this alert" style={{ padding:"6px 14px",borderRadius:6,fontSize:12,fontFamily:"IBM Plex Mono",cursor:"pointer",background:C.purpleDim,border:`1px solid rgba(167,139,250,0.4)`,color:C.purple,display:"flex",alignItems:"center",gap:6 }}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
                Run AI Analysis
              </button>
            }
            {status==="done" && <button type="button" onClick={()=>{setStatus("idle");setParsed(null);}} style={{ padding:"6px 14px",borderRadius:6,fontSize:12,background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,color:C.subtle,cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Re-run</button>}
          </div>

          {status==="idle" && <div style={{ borderRadius:8,border:`1px solid rgba(167,139,250,0.15)`,background:C.purpleDim,padding:12,fontSize:13,color:C.subtle }}>Click <strong style={{ color:C.purple }}>Run AI Analysis</strong> to trigger an autonomous investigation on this alert.</div>}
          {status==="loading" && (
            <div style={{ borderRadius:8,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:14,display:"flex",flexDirection:"column",gap:10 }}>
              {["Routing alert to AI analyst...","Enriching IOC context...","Mapping MITRE ATT&CK techniques...","Generating incident report..."].map((s,i)=>(
                <div key={i} className="pulse mono" style={{ display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.subtle,animationDelay:`${i*0.3}s` }}>
                  <span style={{ width:5,height:5,borderRadius:"50%",background:C.purple,display:"inline-block",flexShrink:0 }}/>{s}
                </div>
              ))}
            </div>
          )}
          {status==="error" && <div style={{ borderRadius:8,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:12,fontSize:12,color:"#f87171" }}><strong>Error:</strong> {errMsg}<div style={{ marginTop:6,fontSize:11,color:C.subtle }}>Check Supabase → Edge Functions → Logs for details.</div></div>}
          {status==="done" && parsed && (
            <div className="fade-in" style={{ display:"flex",flexDirection:"column",gap:10 }}>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
                <div style={{ borderRadius:8,border:`1px solid ${vc.b}`,background:vc.bg,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4 }}>Verdict</div>
                  <div className="mono" style={{ fontSize:15,fontWeight:700,color:vc.c }}>{parsed.verdict?.replace("_"," ")}</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:2 }}>Confidence: {parsed.confidence}%</div>
                </div>
                <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.card,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4 }}>Priority</div>
                  <div className="mono" style={{ fontSize:26,fontWeight:700,color:parsed.priority_score>=8?"#f87171":parsed.priority_score>=5?"#fbbf24":C.green }}>{parsed.priority_score}<span style={{ fontSize:13,color:C.muted }}>/10</span></div>
                  {parsed.escalate && <div style={{ fontSize:11,color:"#f87171",marginTop:2 }}>⚠ Escalate now</div>}

              </div>
              {[["Summary",parsed.summary],["IOC Assessment",parsed.ioc_assessment]].map(([k,v])=>(
                <div key={k} style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.card,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6 }}>{k}</div>
                  <div style={{ fontSize:12,color:C.text,lineHeight:1.75 }}>{v}</div>
                </div>
              ))}
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
                <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.card,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6 }}>MITRE ATT&CK</div>
                  <div className="mono" style={{ fontSize:12,color:C.bright,marginBottom:3 }}>{parsed.mitre_tactic}</div>
                  <div style={{ fontSize:11,color:C.secondary }}>{parsed.mitre_technique}</div>
                </div>
                <div style={{ borderRadius:8,border:`1px solid ${C.border}`,background:C.card,padding:12 }}>
                  <div className="mono" style={{ fontSize:10,color:C.subtle,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6 }}>Root Cause</div>
                  <div style={{ fontSize:12,color:C.text,lineHeight:1.6 }}>{parsed.root_cause}</div>

              <div style={{ borderRadius:8,border:`1px solid rgba(167,139,250,0.2)`,background:C.purpleDim,padding:12 }}>

                {parsed.recommended_actions?.map((a,i)=>(
                  <div key={i} style={{ display:"flex",alignItems:"flex-start",gap:8,marginBottom:8 }}>
                    <span className="mono" style={{ width:18,height:18,borderRadius:"50%",background:C.purpleDim,border:`1px solid rgba(167,139,250,0.3)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:C.purple,flexShrink:0,marginTop:1 }}>{i+1}</span>
                    <span style={{ fontSize:12,color:C.text,lineHeight:1.6 }}>{a}</span>
                  </div>
                ))}

            </div>
          )}
        </div>
      );
    }

    // ── SOAR Playbook ─────────────────────────────────────────────────────────
    const PHASE_COLOR = { Contain:"#f87171", Investigate:"#fbbf24", Eradicate:"#fb923c", Recover:"#4ade80", Report:C.cyan };

    function SOARPlaybook({ alert }) {
      const [status,   setStatus]   = useState("idle");
      const [playbook, setPlaybook] = useState(null);
      const [steps,    setSteps]    = useState({});
      const [errMsg,   setErrMsg]   = useState("");
      useEffect(()=>{ setStatus("idle"); setPlaybook(null); setSteps({}); setErrMsg(""); },[alert?.id]);

      const generate = async () => {
        setStatus("loading");
        try {
          const res = await fetch(SUPABASE_URL, {
            method:"POST", headers:sbHeaders(),
            body:JSON.stringify({ playbookRequest: {
              id:alert.id, severity:alert.severity, title:alert.title,
              tactic:alert.tactic, asset:alert.asset, ip:alert.ip,
              source:alert.source, description:alert.description
            }})
          });
          const data = await res.json();
          if (!res.ok||data.error) throw new Error(data.error||"Error");
          setPlaybook(data.playbook);
          const init = {};
          data.playbook?.steps?.forEach(s=>{ init[s.id]=false; });
          setSteps(init);
          setStatus("done");
        } catch(e) { setErrMsg(e.message); setStatus("error"); }
      };

      const completed = Object.values(steps).filter(Boolean).length;
      const total     = playbook?.steps?.length||0;
      const pct       = total ? Math.round((completed/total)*100) : 0;

      return (
        <div style={{ marginTop:16,borderTop:`1px solid ${C.border}`,paddingTop:16 }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12 }}>
            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3L22 4" stroke="#4ade80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="#4ade80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              <span className="mono" style={{ fontSize:11,color:"#4ade80",textTransform:"uppercase",letterSpacing:"0.1em" }}>SOAR Playbook</span>
              {status==="loading" && <Spinner/>}
              {status==="done" && <span style={{ fontSize:10,color:C.subtle }}>{completed}/{total} steps complete</span>}
            </div>
            {status==="idle" &&
              <button type="button" onClick={generate} style={{ padding:"5px 12px",borderRadius:5,fontSize:11,fontFamily:"IBM Plex Mono",cursor:"pointer",background:"rgba(74,222,128,0.1)",border:"1px solid rgba(74,222,128,0.3)",color:"#4ade80",display:"flex",alignItems:"center",gap:5 }}>
                <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
                Generate Playbook
              </button>
            }
            {status==="done" && <button type="button" onClick={()=>{setStatus("idle");setPlaybook(null);}} style={{ padding:"5px 12px",borderRadius:5,fontSize:11,background:"none",border:`1px solid ${C.border}`,color:C.subtle,cursor:"pointer",fontFamily:"IBM Plex Mono" }}>Clear</button>}
          </div>

          {status==="idle" && <div style={{ borderRadius:7,border:"1px solid rgba(74,222,128,0.15)",background:"rgba(74,222,128,0.05)",padding:11,fontSize:12,color:C.subtle }}>Generate a step-by-step response playbook for this alert based on the MITRE tactic and severity.</div>}
          {status==="loading" && (
            <div style={{ borderRadius:7,border:"1px solid rgba(74,222,128,0.2)",background:"rgba(74,222,128,0.05)",padding:12,display:"flex",flexDirection:"column",gap:8 }}>
              {["Identifying MITRE technique...","Mapping response phases...","Generating step-by-step playbook..."].map((s,i)=>(
                <div key={i} className="pulse mono" style={{ display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.subtle,animationDelay:`${i*0.3}s` }}>
                  <span style={{ width:5,height:5,borderRadius:"50%",background:"#4ade80",display:"inline-block" }}/>{s}
                </div>
              ))}
            </div>
          )}
          {status==="error" && <div style={{ borderRadius:7,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.05)",padding:11,fontSize:12,color:"#f87171" }}>{errMsg}</div>}
          {status==="done" && playbook && (
            <div className="fade-in">
              {/* Header */}
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10 }}>
                <div>
                  <div style={{ fontSize:13,fontWeight:600,color:C.bright }}>{playbook.playbook_name}</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:2 }}>Est. {playbook.estimated_time} · {total} steps</div>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div className="mono" style={{ fontSize:18,fontWeight:700,color:pct===100?"#4ade80":"#fbbf24" }}>{pct}%</div>
                  <div style={{ fontSize:10,color:C.subtle }}>complete</div>
                </div>
              </div>
              {/* Progress bar */}
              <div style={{ height:4,background:"rgba(255,255,255,0.05)",borderRadius:2,overflow:"hidden",marginBottom:12 }}>
                <div style={{ height:"100%",background:pct===100?"#4ade80":"#fbbf24",borderRadius:2,width:`${pct}%`,transition:"width 0.4s ease" }}/>
              </div>
              {/* Steps */}
              {playbook.steps?.map(step=>{
                const done = steps[step.id];
                const pc = PHASE_COLOR[step.phase]||C.cyan;
                return (
                  <button key={step.id} type="button" onClick={()=>setSteps(prev=>({...prev,[step.id]:!prev[step.id]}))}
                    style={{ width:"100%",textAlign:"left",padding:"10px 12px",borderRadius:7,marginBottom:6,border:`1px solid ${done?"rgba(74,222,128,0.25)":C.border}`,background:done?"rgba(74,222,128,0.05)":"rgba(255,255,255,0.02)",cursor:"pointer",transition:"all 0.15s" }}>
                    <div style={{ display:"flex",alignItems:"flex-start",gap:10 }}>
                      <div style={{ width:18,height:18,borderRadius:"50%",border:`1px solid ${done?"#4ade80":C.border}`,background:done?"#4ade80":"none",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,transition:"all 0.2s" }}>
                        {done && <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#000" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </div>
                      <div style={{ flex:1,minWidth:0 }}>
                        <div style={{ display:"flex",alignItems:"center",gap:6,marginBottom:3 }}>
                          <span style={{ fontSize:9,fontFamily:"IBM Plex Mono",padding:"1px 5px",borderRadius:3,color:pc,background:`${pc}18`,border:`1px solid ${pc}30` }}>{step.phase.toUpperCase()}</span>
                          <span style={{ fontSize:10,color:C.subtle }}>Step {step.id}</span>
                          {step.tool && <span className="mono" style={{ fontSize:9,color:C.muted }}>via {step.tool}</span>}
                        </div>
                        <div style={{ fontSize:12,color:done?C.subtle:C.bright,textDecoration:done?"line-through":"none",lineHeight:1.4,transition:"color 0.2s" }}>{step.action}</div>
                        {step.details && !done && <div style={{ fontSize:11,color:C.subtle,marginTop:3,lineHeight:1.5 }}>{step.details}</div>}
                      </div>
                    </div>
                  </button>
                );
              })}
              {pct===100 && (
                <div style={{ borderRadius:7,border:"1px solid rgba(74,222,128,0.3)",background:"rgba(74,222,128,0.08)",padding:11,textAlign:"center" }}>
                  <div style={{ fontSize:13,color:"#4ade80",fontWeight:600 }}>✓ Playbook Complete</div>
                  <div style={{ fontSize:11,color:C.subtle,marginTop:3 }}>All response steps completed — document in incident timeline</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── AlertRow ──────────────────────────────────────────────────────────────
    // ── SLA Thresholds ────────────────────────────────────────────────────────
    const SLA_MINUTES = { CRITICAL:15, HIGH:60, MEDIUM:240, LOW:1440 };

    function getSLA(alert) {
      if (alert.status === "Closed" || alert.status === "Investigating") return null;
      const slaMin   = SLA_MINUTES[alert.severity] || 1440;
      const ageMin   = Math.floor((Date.now() - PAGE_LOAD + alert.offsetMs) / 60000);
      const remMin   = slaMin - ageMin;
      const breached = remMin <= 0;
      const urgent   = !breached && remMin <= slaMin * 0.25; // within 25% of deadline
      return { slaMin, ageMin, remMin, breached, urgent };
    }

    function SLABadge({ alert, compact=false }) {
      const sla = getSLA(alert);
      if (!sla) return null;
      if (sla.breached) return (
        <span className="mono" style={{ fontSize:9,padding:"1px 5px",borderRadius:3,background:"rgba(220,38,38,0.15)",border:"1px solid rgba(220,38,38,0.4)",color:"#f87171",flexShrink:0,whiteSpace:"nowrap" }}>
          {compact ? "⚡SLA" : `⚡ SLA BREACHED +${Math.abs(sla.remMin)}m`}
        </span>
      );
      if (sla.urgent) return (
        <span className="mono" style={{ fontSize:9,padding:"1px 5px",borderRadius:3,background:"rgba(251,146,60,0.12)",border:"1px solid rgba(251,146,60,0.35)",color:"#fb923c",flexShrink:0,whiteSpace:"nowrap" }}>
          {compact ? "⏱SLA" : `⏱ SLA: ${sla.remMin}m left`}
        </span>
      );
      return null;
    }

    function AlertRow({ alert, onClick, selected, timeStr }) {

      return (

            <span style={{ fontSize:11,color:C.subtle,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{alert.asset}</span>
            {alert.status !== "Open" && (
              <span className="mono" style={{ marginLeft:"auto",fontSize:9,padding:"1px 5px",borderRadius:3,color:sc,background:`${sc}15`,border:`1px solid ${sc}30`,flexShrink:0,whiteSpace:"nowrap" }}>{alert.status}</span>
            )}

    // ── Alert Correlation Engine ──────────────────────────────────────────────
    function CorrelationBanner({ alert, alerts, onSelect }) {
      if (!alert) return null;
      const WINDOW_MS = 60 * 60 * 1000; // 60 minute window
      const correlated = alerts.filter(a => {
        if (a.id === alert.id) return false;
        if (a.status === "Closed") return false;
        const sameAsset = alert.asset && a.asset && alert.asset !== "—" && a.asset === alert.asset;
        const sameIP    = alert.ip    && a.ip    && alert.ip    !== "—" && a.ip    === alert.ip;
        const inWindow  = Math.abs(a.offsetMs - alert.offsetMs) <= WINDOW_MS;
        return (sameAsset || sameIP) && inWindow;
      });
      if (!correlated.length) return null;
      const reasons = correlated.map(a => {
        const parts = [];
        if (a.asset === alert.asset && alert.asset !== "—") parts.push(`same asset (${alert.asset})`);
        if (a.ip    === alert.ip    && alert.ip    !== "—") parts.push(`same IP (${alert.ip})`);
        return { alert:a, reason:parts.join(", ") };
      });
      return (
        <div style={{ borderRadius:8,border:"1px solid rgba(251,146,60,0.4)",background:"rgba(251,146,60,0.06)",padding:12 }}>
          <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:10 }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="#fb923c" strokeWidth="1.5" strokeLinecap="round"/></svg>
            <span className="mono" style={{ fontSize:11,color:"#fb923c",textTransform:"uppercase",letterSpacing:"0.1em" }}>
              {correlated.length} Correlated Alert{correlated.length>1?"s":""}
            </span>
            <span style={{ fontSize:11,color:C.muted }}>· within 60 min window</span>
          </div>
          {reasons.map(({alert:a, reason})=>{
            const sv = SEV[a.severity]||SEV.LOW;
            return (
              <button key={a.id} type="button" onClick={()=>onSelect(a)}
                style={{ width:"100%",textAlign:"left",display:"flex",alignItems:"center",gap:10,padding:"7px 8px",borderRadius:6,background:"rgba(255,255,255,0.03)",border:`1px solid rgba(251,146,60,0.2)`,cursor:"pointer",marginBottom:4,transition:"background 0.15s" }}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(251,146,60,0.08)"}
                onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,0.03)"}>
                <span style={{ width:6,height:6,borderRadius:"50%",background:sv.dot,flexShrink:0 }}/>
                <span className="mono" style={{ fontSize:10,color:C.subtle,flexShrink:0,width:54 }}>{a.id}</span>
                <span style={{ fontSize:12,color:C.text,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{a.title}</span>
                <span style={{ fontSize:10,color:"#fb923c",flexShrink:0,marginLeft:8 }}>{reason}</span>
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" style={{ flexShrink:0,color:C.muted }}><path d="M9 18l6-6-6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </button>
            );
          })}
        </div>
      );
    }

    // ── Analyst Notes ─────────────────────────────────────────────────────────
    function AnalystNotes({ alert }) {
      const [note,      setNote]      = useState("");
      const [saved,     setSaved]     = useState(false);
      const [saving,    setSaving]    = useState(false);
      const [lastSaved, setLastSaved] = useState(null);

      // Load existing notes from localStorage (keyed by alert ID)
      useEffect(()=>{
        if (!alert) return;
        const stored = localStorage.getItem(`siq_note_${alert.id}`);
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            setNote(parsed.text||"");
            setLastSaved(parsed.savedAt||null);
          } catch { setNote(stored); }
        } else {
          setNote("");
          setLastSaved(null);
        }
      },[alert?.id]);

      const save = async () => {
        if (!alert) return;
        setSaving(true);
        const ts = new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
        // Persist to localStorage immediately
        localStorage.setItem(`siq_note_${alert.id}`, JSON.stringify({ text:note, savedAt:ts }));
        // Also write to Supabase if available
        try {
          await fetch(
            `https://xkadqvmqxdyqoddiypet.supabase.co/rest/v1/soc_alerts?id=eq.${alert.id}`,
            { method:"PATCH", headers:{ apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}`, "Content-Type":"application/json" }, body:JSON.stringify({ notes:note }) }
          );
        } catch {}
        setLastSaved(ts);
        setSaving(false);
        setSaved(true);
        setTimeout(()=>setSaved(false),2000);
      };

      return (
        <div style={{ marginTop:14,borderTop:`1px solid ${C.border}`,paddingTop:14 }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8 }}>
            <div style={{ display:"flex",alignItems:"center",gap:7 }}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke={C.cyan} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke={C.cyan} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              <span className="mono" style={{ fontSize:11,color:C.cyan,textTransform:"uppercase",letterSpacing:"0.1em" }}>Analyst Notes</span>
              {lastSaved && <span style={{ fontSize:10,color:C.muted }}>· saved {lastSaved}</span>}
            </div>
            <button type="button" onClick={save} disabled={saving}
              style={{ padding:"4px 12px",borderRadius:5,fontSize:11,fontFamily:"IBM Plex Mono",cursor:saving?"not-allowed":"pointer",background:saved?C.greenDim:C.cyanDim,border:`1px solid ${saved?"rgba(74,222,128,0.3)":"rgba(34,211,238,0.3)"}`,color:saved?C.green:C.cyan,transition:"all 0.2s" }}>
              {saving?"Saving...":saved?"✓ Saved":"Save"}
            </button>
          </div>
          <label htmlFor={`note-${alert?.id}`} style={{ position:"absolute",width:1,height:1,overflow:"hidden",clip:"rect(0,0,0,0)" }}>Analyst notes for {alert?.id}</label>
          <textarea id={`note-${alert?.id}`} value={note} onChange={e=>setNote(e.target.value)}
            placeholder="Document your analysis, findings, or actions taken..."
            rows={4}
            style={{ width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 12px",fontSize:12,color:C.bright,fontFamily:"DM Sans,sans-serif",lineHeight:1.6,resize:"vertical",transition:"border 0.15s" }}
            onFocus={e=>e.target.style.borderColor="rgba(34,211,238,0.4)"}
            onBlur={e=>e.target.style.borderColor=C.border}
          />
          <div style={{ fontSize:10,color:C.muted,marginTop:4 }}>Saved locally + synced to Supabase · {note.length} chars</div>
        </div>
      );
    }

    // ── AlertDetail ───────────────────────────────────────────────────────────

      if(!alert) return (

              <span style={{ marginLeft:"auto",fontSize:11,fontFamily:"IBM Plex Mono",padding:"2px 8px",borderRadius:4,color:sc,background:`${sc}18`,border:`1px solid ${sc}40` }}>{alert.status}</span>

            {/* Triage actions */}
            <div style={{ display:"flex",gap:6,flexWrap:"wrap",alignItems:"center" }}>
              {["Escalate","Investigate","Close","Assign"].map(action=>(
                <button key={action} type="button" onClick={()=>onTriage(action,alert)}
                  style={{ padding:"4px 10px",fontSize:11,fontFamily:"IBM Plex Mono",borderRadius:4,cursor:"pointer",border:`1px solid ${C.border2}`,background:"rgba(255,255,255,0.04)",color:C.secondary,transition:"all 0.15s" }}
                  onMouseEnter={e=>{ e.currentTarget.style.background=C.cyanDim; e.currentTarget.style.color=C.cyan; e.currentTarget.style.borderColor="rgba(34,211,238,0.3)"; }}
                  onMouseLeave={e=>{ e.currentTarget.style.background="rgba(255,255,255,0.04)"; e.currentTarget.style.color=C.secondary; e.currentTarget.style.borderColor=C.border2; }}

              <div style={{ width:1,height:16,background:C.border,margin:"0 2px" }}/>

                style={{ padding:"4px 10px",fontSize:11,fontFamily:"IBM Plex Mono",borderRadius:4,cursor:"pointer",border:"1px solid rgba(167,139,250,0.4)",background:C.purpleDim,color:C.purple }}>
                + Incident
              </button>
            </div>
          </div>

          {/* Sub-tabs */}
          <div style={{ borderBottom:`1px solid ${C.border}`,display:"flex",flexShrink:0,marginTop:12 }}>
            {TABS.map(t=>(
              <button key={t.key} type="button" onClick={()=>setDetailTab(t.key)}
                style={{ padding:"8px 14px",fontSize:11,fontFamily:"IBM Plex Mono",textTransform:"uppercase",letterSpacing:"0.08em",background:"none",border:"none",cursor:"pointer",borderBottom:detailTab===t.key?`2px solid ${C.cyan}`:"2px solid transparent",color:detailTab===t.key?C.cyan:C.subtle,transition:"color 0.15s",whiteSpace:"nowrap" }}>
                {t.label}
              </button>
            ))}
          </div>

          {/* Tab content */}
          <div style={{ flex:1,overflowY:"auto",paddingTop:12 }}>

            {detailTab==="overview" && (
              <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
                {/* Correlation banner */}
                {correlated.length>0 && <CorrelationBanner alert={alert} alerts={alerts||[]} onSelect={a=>onSelectAlert&&onSelectAlert(a)}/>}
                {/* Metadata grid */}
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
                  {[["Asset",alert.asset],["Source",alert.source],["IP / Host",alert.ip],["Tactic",alert.tactic]].map(([k,v])=>(
                    <div key={k} style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:8 }}>
                      <div style={{ fontSize:11,color:C.subtle,marginBottom:2 }}>{k}</div>
                      <div className="mono" style={{ fontSize:12,color:C.bright }}>{v}</div>
                    </div>
                  ))}
                </div>
                {/* Description */}
                <div style={{ background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:10 }}>
